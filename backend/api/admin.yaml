        email:
          type: string
        name:
          type: string
        role:
          $ref: "#/components/schemas/StaffRole"
    StaffSession:
      type: object
      additionalProperties: false
      required: [staff, csrf_token, expires_at, idle_expires_at]
      properties:
        staff:
          $ref: "#/components/schemas/Staff"
        csrf_token:
          type: string
        expires_at:
          type: string
          format: date-time
          description: The session ends at this time whatever happens.
        idle_expires_at:
          type: string
          format: date-time
          description: The session ends at this time unless it is used before.
    AdminTenant:
      type: object
      additionalProperties: false
      required: [id, name, region, status, origin, production_enabled, created_at, active_users, active_api_keys]
      properties:
        id:
          type: string
        name:
          type: string
        region:
          type: string
        status:
          type: string
          enum: [active, suspended, disabled]
        origin:
          type: string
          enum: [operator, self_serve]
        production_enabled:
          type: boolean
          description: Whether the production environment is open (self-serve workspaces open it when onboarding is approved).
        created_at:
          type: string
          format: date-time
        active_users:
          type: integer
          format: int64
        active_api_keys:
          type: integer
          format: int64
          description: Keys that are neither revoked nor expired, in both environments.
        onboarding_status:
          type: string
          nullable: true
          description: The compliance onboarding's status, or null for a workspace that has none.
    AdminTenantDetail:
      type: object
      additionalProperties: false
      required: [tenant, security, since, recent_staff_actions]
      properties:
        tenant:
          $ref: "#/components/schemas/AdminTenant"
        security:
          $ref: "#/components/schemas/TenantSecurity"
        since:
          type: string
          format: date-time
          description: The start of the window the security counts cover.
        recent_staff_actions:
          type: array
          description: The staff audit entries that name this tenant, newest first.
          items:
            $ref: "#/components/schemas/StaffAuditEntry"
    AdminOverview:
      type: object
      additionalProperties: false
      required: [tenants_total, tenants_active, tenants_suspended, onboarding_submitted, support_pending, support_active, staff_active, status_requests_pending]
      properties:
        tenants_total:
          type: integer
          format: int64
        tenants_active:
          type: integer
          format: int64
        tenants_suspended:
          type: integer
          format: int64
        onboarding_submitted:
          type: integer
          format: int64
          description: Onboarding reviews waiting for a decision.
        support_pending:
          type: integer
          format: int64
          description: Support-access requests made by someone else, waiting for this staff member's decision.
        support_active:
          type: integer
          format: int64
          description: Support access that is approved and has not ended.
        staff_active:
          type: integer
          format: int64
        status_requests_pending:
          type: integer
          format: int64
          description: Requests to suspend or reactivate a tenant, made by someone else, waiting for this staff member's decision.
    AdminTenantList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AdminTenant"
    TenantSecurity:
      type: object
      additionalProperties: false

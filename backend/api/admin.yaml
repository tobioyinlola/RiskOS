        tenant_id:
          type: string
        tenant_name:
          type: string
        action:
          type: string
          enum: [suspend, reactivate]
        reason:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected, withdrawn]
        requested_by:
          $ref: "#/components/schemas/StaffRef"
        created_at:
          type: string
          format: date-time
        decided_by:
          $ref: "#/components/schemas/StaffRef"
        decided_at:
          type: string
          format: date-time

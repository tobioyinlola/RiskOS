openapi: 3.0.3
info:
  title: RiskOS internal admin API
  version: 1.0.0
  description: |
    The internal admin realm for RiskOS staff (docs/ADMIN.md). Not part of the customer API.

    Staff accounts are separate from tenant users, created only by the operator CLI, and sign in
    with passkeys only. Sessions are short (15 minutes idle, 4 hours at most) and carried by the
    `riskos_staff` cookie (HttpOnly, SameSite=Strict). Unsafe requests need the session's CSRF
    token in `X-CSRF-Token` and an allowed `Origin`. Every staff action is recorded in the staff
    audit log.

    Staff hold no access to tenant data. Support access to one tenant is requested by one staff
    member and approved by another; it is read-only, lasts at most four hours, and is recorded in
    the tenant's own audit log. While approved, the requester reads that tenant through the customer
    API (`GET` only) with the `RiskOS-Support-Grant` header and their staff session.
servers:
  - url: /
security: []
tags:
  - name: staff-session
  - name: staff
paths:
  /api/admin/v1/auth/enroll/options:
    post:
      operationId: staffEnrollOptions
      tags: [staff-session]
      summary: Start registering a staff member's first passkey
      description: Takes the single-use enrollment token from the link the operator CLI printed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollOptionsRequest"
      responses:
        "200":
          description: WebAuthn creation options and the ceremony to finish.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ceremony"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/admin/v1/auth/enroll:
    post:
      operationId: staffEnroll
      tags: [staff-session]
      summary: Finish registering the first passkey, and sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollRequest"
      responses:
        "200":
          description: The new session.
          headers:
            Set-Cookie:
              description: The staff session cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffSession"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/admin/v1/auth/login/options:
    post:
      operationId: staffLoginOptions
      tags: [staff-session]
      summary: Start signing in with a passkey
      description: Discoverable credentials, so no email is asked for.
      responses:
        "200":
          description: WebAuthn assertion options and the ceremony to finish.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ceremony"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/admin/v1/auth/login:
    post:
      operationId: staffLogin
      tags: [staff-session]
      summary: Finish signing in with a passkey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: The new session.
          headers:
            Set-Cookie:
              description: The staff session cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffSession"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/admin/v1/auth/session:
    get:
      operationId: getStaffSession
      tags: [staff-session]
      summary: The current staff session
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffSession"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/admin/v1/auth/logout:
    post:
      operationId: staffLogout
      tags: [staff-session]
      summary: End the staff session
      responses:
        "204":
          description: Signed out.
          headers:
            Set-Cookie:
              description: Clears the staff session cookie.
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/admin/v1/overview:
    get:
      operationId: getAdminOverview
      tags: [staff]
      summary: What waits for the signed-in staff member
      description: |
        Counts only: tenants by status, onboarding reviews and support requests awaiting a decision
        (requests the caller made themselves are excluded: nobody decides their own), and active
        support access.
      responses:
        "200":
          description: The counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/admin/v1/tenants:
    get:
      operationId: listAdminTenants
      tags: [staff]
      summary: Tenants (identity, status and counts only)
      description: Never tenant data; that is reached only through approved support access.
      responses:
        "200":
          description: Tenants, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTenantList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/admin/v1/tenants/{tenant_id}:
    get:
      operationId: getAdminTenant
      tags: [staff]
      summary: One tenant (identity, status, counts and staff activity only)
      parameters:
        - $ref: "#/components/parameters/TenantID"
      responses:
        "200":
          description: The tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTenantDetail"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/admin/v1/tenants/{tenant_id}/status-requests:
    post:
      operationId: requestTenantStatus
      tags: [staff]
      summary: Ask for a tenant to be suspended or reactivated
      description: |
        A different staff member must approve it; nothing changes until they do. One request may be
        pending per tenant. Recorded in the staff audit log.
      parameters:
        - $ref: "#/components/parameters/TenantID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantStatusChange"
      responses:
        "201":
          description: The pending request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantStatusRequest"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/admin/v1/tenant-status-requests:
    get:
      operationId: listTenantStatusRequests
      tags: [staff]
      summary: Requests to suspend or reactivate tenants, newest first
      responses:
        "200":
          description: Requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantStatusRequestList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/admin/v1/tenant-status-requests/{request_id}/approve:
    post:
      operationId: approveTenantStatus
      tags: [staff]
      summary: Approve another staff member's request
      description: |
        Applies the change at once, in the same transaction as the audit entries. The tenant sees
        `tenant.suspended` or `tenant.reactivated` in its audit log, without the reason.
      parameters:
        - $ref: "#/components/parameters/StatusRequestID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantStatusDecision"
      responses:
        "200":
          description: The approved request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantStatusRequest"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/admin/v1/tenant-status-requests/{request_id}/reject:
    post:
      operationId: rejectTenantStatus
      tags: [staff]
      summary: Reject another staff member's request
      parameters:
        - $ref: "#/components/parameters/StatusRequestID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantStatusDecision"
      responses:
        "200":
          description: The rejected request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantStatusRequest"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/admin/v1/tenant-status-requests/{request_id}/withdraw:
    post:
      operationId: withdrawTenantStatus
      tags: [staff]
      summary: Take back your own pending request
      parameters:
        - $ref: "#/components/parameters/StatusRequestID"
      responses:
        "200":
          description: The withdrawn request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantStatusRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/admin/v1/staff:
    get:
      operationId: listStaffRoster
      tags: [staff]
      summary: Staff accounts (security administrators only)
      description: |
        Role, status, passkey count, last sign-in and whether an enrollment link is outstanding.
        Never a credential. Accounts are created, and enrollment links issued, with the operator
        CLI only.
      responses:
        "200":
          description: Staff accounts, oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffRosterList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/admin/v1/staff/{staff_id}/disable:
    post:
      operationId: disableStaff
      tags: [staff]
      summary: Disable another staff member's account
      description: |
        Security administrators only. Ends the person's sessions at once. Refused for your own
        account and for the last active security administrator. Recorded in the staff audit log.
      parameters:
        - $ref: "#/components/parameters/StaffID"
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffRosterEntry"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/admin/v1/staff/{staff_id}/enable:
    post:
      operationId: enableStaff
      tags: [staff]
      summary: Enable a disabled staff account
      description: Security administrators only; never your own account. Recorded in the staff audit log.
      parameters:
        - $ref: "#/components/parameters/StaffID"
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffRosterEntry"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/admin/v1/security:
    get:
      operationId: getSecurityOverview
      tags: [staff]
      summary: Security signals across tenants
      description: |
        Counts per tenant over the last 24 hours (security alerts and disabled webhook endpoints: as
        of now). Never tenant data.
      responses:
        "200":
          description: The overview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityOverview"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/admin/v1/support-access:
    get:
      operationId: listSupportAccess
      tags: [staff]
      summary: Support access requests, newest first
      responses:
        "200":
          description: Requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportAccessList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        default:
          $ref: "#/components/responses/DefaultError"
    post:
      operationId: requestSupportAccess
      tags: [staff]
      summary: Request read-only access to one tenant
      description: Another staff member must approve it. Recorded in the tenant's audit log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportAccessRequest"
      responses:
        "201":
          description: The pending request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportAccess"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/admin/v1/support-access/{access_id}/approve:
    post:
      operationId: approveSupportAccess
      tags: [staff]
      summary: Approve another staff member's request
      description: Access starts now and lasts the requested duration. Recorded in the tenant's audit log.
      parameters:
        - $ref: "#/components/parameters/AccessID"
      responses:
        "200":
          description: The approved request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportAccess"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/admin/v1/support-access/{access_id}/reject:
    post:
      operationId: rejectSupportAccess
      tags: [staff]
      summary: Reject another staff member's request
      parameters:
        - $ref: "#/components/parameters/AccessID"
      responses:
        "200":
          description: The rejected request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportAccess"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/admin/v1/support-access/{access_id}/revoke:
    post:
      operationId: revokeSupportAccess
      tags: [staff]
      summary: End approved access early, or withdraw a pending request
      description: Any staff member may revoke. Recorded in the tenant's audit log.
      parameters:
        - $ref: "#/components/parameters/AccessID"
      responses:
        "200":
          description: The revoked request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportAccess"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/admin/v1/onboarding:
    get:
      operationId: listOnboardingReviews
      tags: [staff]
      summary: Self-serve workspaces' compliance onboarding, submitted first
      description: Identity, status and dates only. Requires the operations_admin role.
      responses:
        "200":
          description: The queue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingQueue"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/admin/v1/onboarding/{tenant_id}:
    get:
      operationId: getOnboardingReview
      tags: [staff]
      summary: One workspace's onboarding answers
      description: |
        Requires the operations_admin role. Reading the answers is recorded in the staff audit log
        and the tenant's.
      parameters:
        - $ref: "#/components/parameters/TenantID"
      responses:
        "200":
          description: The onboarding.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingReview"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/admin/v1/onboarding/{tenant_id}/approve:
    post:
      operationId: approveOnboarding
      tags: [staff]
      summary: Approve a submitted onboarding
      description: |
        Requires the operations_admin role. Opens the workspace's production environment. Recorded in
        the staff audit log and the tenant's.
      parameters:
        - $ref: "#/components/parameters/TenantID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingDecision"
      responses:
        "200":
          description: The approved onboarding.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingReview"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/admin/v1/onboarding/{tenant_id}/reject:
    post:
      operationId: rejectOnboarding
      tags: [staff]
      summary: Send a submitted onboarding back with a note
      description: |
        Requires the operations_admin role and a note of 10 to 1000 characters, which the customer
        sees. The customer can change their answers and submit again. Production stays locked.
      parameters:
        - $ref: "#/components/parameters/TenantID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingDecision"
      responses:
        "200":
          description: The rejected onboarding.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingReview"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/admin/v1/audit-log:
    get:
      operationId: listStaffAudit
      tags: [staff]
      summary: The staff audit log, newest first
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        "200":
          description: Entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffAuditList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        default:
          $ref: "#/components/responses/DefaultError"
components:
  parameters:
    TenantID:
      name: tenant_id
      in: path
      required: true
      schema:
        type: string
        example: ten_01j9x2k7m3q4r5s6t7v8w9x0yz
    AccessID:
      name: access_id
      in: path
      required: true
      schema:
        type: string
        example: sac_01j9x2k7m3q4r5s6t7v8w9x0yz
    StaffID:
      name: staff_id
      in: path
      required: true
      schema:
        type: string
        example: stf_01j9x2k7m3q4r5s6t7v8w9x0yz
    StatusRequestID:
      name: request_id
      in: path
      required: true
      schema:
        type: string
        example: tsr_01j9x2k7m3q4r5s6t7v8w9x0yz
  responses:
    DefaultError:
      description: Error in the standard RiskOS error contract.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidRequest:
      description: The request is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthenticated:
      description: No valid staff session (or the passkey did not verify).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Not allowed (for example, approving your own request).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The request is not in a state that allows this.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Too many attempts.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
    WebAuthnOptions:
      type: object
      additionalProperties: true
      description: WebAuthn options, passed to the browser's credentials API as returned.
    Ceremony:
      type: object
      additionalProperties: false
      required: [ceremony_id, options]
      properties:
        ceremony_id:
          type: string
        options:
          $ref: "#/components/schemas/WebAuthnOptions"
    EnrollOptionsRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          maxLength: 128
    StaffRosterEntry:
      type: object
      additionalProperties: false
      required: [id, email, name, role, status, passkeys, enrollment_pending, created_at]
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        role:
          $ref: "#/components/schemas/StaffRole"
        status:
          type: string
          enum: [active, disabled]
        passkeys:
          type: integer
          format: int64
          description: Registered passkeys. Zero until the person has enrolled.
        last_sign_in:
          type: string
          format: date-time
          nullable: true
        enrollment_pending:
          type: boolean
          description: An enrollment link has been issued and has not been used or expired.
        created_at:
          type: string
          format: date-time
    StaffRosterList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/StaffRosterEntry"
    TenantStatusChange:

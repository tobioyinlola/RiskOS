            $ref: "#/components/schemas/AnalyticsPoint"
        top_users:
          type: array
          items:
            $ref: "#/components/schemas/TopUser"
        top_signals:
          type: array
          items:
            $ref: "#/components/schemas/SignalCount"
    AnalyticsPoint:
      type: object

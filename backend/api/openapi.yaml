      properties:
        minimal:
          type: integer
        low:
          type: integer
        elevated:
          type: integer
        high:
          type: integer
        critical:
          type: integer
    TopUser:
      type: object
      additionalProperties: false
      required: [user_id, max_score, events, flagged, last_seen]
      properties:
        user_id:
          type: string
        max_score:
          type: integer
        events:
          type: integer
        flagged:
          type: integer
          description: Events that got Review or Block.
        last_seen:
          type: string
          format: date-time
    SignalCount:
      type: object
      additionalProperties: false
      required: [code, label, hits]
      properties:
        code:
          type: string
        label:
          type: string
        hits:
          type: integer
    EventList:
      type: object
      additionalProperties: false
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/EventSummary"
        next_cursor:
          type: string
          nullable: true
    EventDetail:
      type: object
      additionalProperties: false
      required: [id, event_key, type, environment, occurred_at, received_at, raw_payload, normalized_payload, evaluation]
      properties:
        id:
          type: string
        event_key:
          type: string
        type:
          $ref: "#/components/schemas/EventType"
        environment:
          $ref: "#/components/schemas/Environment"
        occurred_at:
          type: string
          format: date-time
        received_at:
          type: string
          format: date-time
        raw_payload:
          type: object
          additionalProperties: true
          description: The request body as received.
        normalized_payload:
          type: object
          additionalProperties: true
          description: The canonical form the risk engine evaluated.
        evaluation:
          $ref: "#/components/schemas/RiskDecision"

    RuleCondition:
      type: object
      additionalProperties: true
      description: |
        A condition tree. Each node is exactly one of:
        `{"all": [node, ...]}`, `{"any": [node, ...]}`, `{"not": node}`, or a comparison
        `{"field": "<field>", "op": "<operator>", "value": <value>}`. Fields and their operators
        are listed by `GET /api/v1/risk/catalog`. At most 50 nodes, 6 levels deep, 100 list
        items. A comparison on a field the event does not have never matches.
      example:
        all:
          - field: transaction.amount
            op: gt
            value: 1000000
          - field: feature.new_beneficiary
            op: eq
            value: true
    Severity:
      type: string
      enum: [low, medium, high, critical]
    RuleMode:
      type: string
      enum: [active, shadow]
      description: active rules add their weight to the score; shadow rules are only recorded.
    Rule:
      type: object
      additionalProperties: false
      required: [id, code, name, description, severity, weight, mode, enabled, condition, version, created_at, updated_at]
      properties:
        id:
          type: string
          example: rul_01j9x2k7m3q4r5s6t7v8w9x0yz
        code:
          type: string
          description: Signal code the rule emits when it matches.
          example: high_value_new_beneficiary
        name:
          type: string
        description:
          type: string
        severity:
          $ref: "#/components/schemas/Severity"
        weight:
          type: integer
          minimum: 0
          maximum: 100
        mode:
          $ref: "#/components/schemas/RuleMode"
        enabled:
          type: boolean
        condition:
          $ref: "#/components/schemas/RuleCondition"
        version:
          type: integer
        restored_from:
          type: integer
          nullable: true
          description: Set when this version restored an earlier one.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          description: When the current version was created.
        pending_change_id:
          type: string
          nullable: true
          description: A proposed change awaiting approval (production), if any.
    RuleList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Rule"
    CreateRuleRequest:
      type: object
      additionalProperties: false
      required: [code, name, severity, weight, mode, condition]
      properties:
        code:
          type: string
          pattern: "^[a-z][a-z0-9_]{2,63}$"
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        severity:
          $ref: "#/components/schemas/Severity"
        weight:
          type: integer
          minimum: 0
          maximum: 100
        mode:
          $ref: "#/components/schemas/RuleMode"
        enabled:
          type: boolean
          default: true
        condition:
          $ref: "#/components/schemas/RuleCondition"
    UpdateRuleRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        severity:
          $ref: "#/components/schemas/Severity"
        weight:
          type: integer
          minimum: 0
          maximum: 100
        mode:
          $ref: "#/components/schemas/RuleMode"
        enabled:
          type: boolean
        condition:
          $ref: "#/components/schemas/RuleCondition"
    RuleVersion:
      type: object
      additionalProperties: false
      required: [version, name, description, severity, weight, mode, enabled, condition, created_at, created_by]
      properties:
        version:
          type: integer
        name:
          type: string
        description:
          type: string
        severity:
          $ref: "#/components/schemas/Severity"
        weight:
          type: integer
        mode:
          $ref: "#/components/schemas/RuleMode"
        enabled:
          type: boolean
        condition:
          $ref: "#/components/schemas/RuleCondition"
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
        restored_from:
          type: integer
          nullable: true
    DenyKind:
      type: string
      enum: [user, account, device, ip, beneficiary, country]
    DenyEntry:
      type: object
      additionalProperties: false
      required: [id, kind, value, reason, expires_at, created_at, created_by]
      properties:
        id:
          type: string
          example: dny_01j9x2k7m3q4r5s6t7v8w9x0yz
        kind:
          $ref: "#/components/schemas/DenyKind"
        value:
          type: string
        reason:
          type: string
        expires_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
    DenyEntryList:
      type: object
      additionalProperties: false
      required: [data, total, limit]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/DenyEntry"
        total:
          type: integer
          description: Entries in the environment, including those not listed here.
        limit:
          type: integer
          description: The most entries an environment can have.
    CreateDenyEntryRequest:
      type: object
      additionalProperties: false
      required: [kind, value]
      properties:
        kind:
          $ref: "#/components/schemas/DenyKind"
        value:
          type: string
          minLength: 1
          maxLength: 128
        reason:
          type: string
          maxLength: 200
        expires_at:
          type: string
          format: date-time
          nullable: true
    RuleChange:
      type: object
      additionalProperties: false
      required: [id, rule_id, code, kind, base_version, status, proposed, proposed_by, proposed_at, decided_by, decided_at, reason, applied_version]
      properties:
        id:
          type: string
          example: rch_01j9x2k7m3q4r5s6t7v8w9x0yz
        rule_id:
          type: string
          description: The rule changed, or for a new rule the ID it gets when approved.
        code:
          type: string
        kind:
          type: string
          enum: [create, update, rollback]
        base_version:
          type: integer
          nullable: true
          description: The rule's version when proposed (null for a new rule).
        status:
          type: string
          enum: [pending, approved, rejected]
        proposed:
          $ref: "#/components/schemas/RuleContent"
        proposed_by:
          type: string
        proposed_at:
          type: string
          format: date-time
        decided_by:
          type: string
          nullable: true
        decided_at:
          type: string
          format: date-time
          nullable: true
        reason:
          type: string
          nullable: true
          description: Why it was rejected, when given.
        applied_version:
          type: integer
          nullable: true
          description: The version approval created.
    RuleContent:
      type: object
      additionalProperties: false
      required: [name, description, severity, weight, mode, enabled, condition, restored_from]
      properties:
        name:
          type: string
        description:
          type: string
        severity:
          $ref: "#/components/schemas/Severity"
        weight:
          type: integer
        mode:
          $ref: "#/components/schemas/RuleMode"
        enabled:
          type: boolean
        condition:
          $ref: "#/components/schemas/RuleCondition"
        restored_from:
          type: integer
          nullable: true
    RuleChangeList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/RuleChange"
    RejectRuleChangeRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 500
    RuleVersionList:
      type: object
      additionalProperties: false
      required: [rule_id, current_version, data]
      properties:
        rule_id:
          type: string
        current_version:
          type: integer
        data:
          type: array
          items:
            $ref: "#/components/schemas/RuleVersion"
    RollbackRuleRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version:
          type: integer
          minimum: 1
    TestRuleRequest:
      type: object
      additionalProperties: false
      required: [event]
      properties:
        event:
          $ref: "#/components/schemas/Event"
        condition:
          $ref: "#/components/schemas/RuleCondition"
    TestRuleResult:
      type: object
      additionalProperties: false
      required: [rule_id, draft, matched, facts]
      properties:
        rule_id:
          type: string
        version:
          type: integer
          nullable: true
          description: The version tested; null when a draft condition was tested.
        draft:
          type: boolean
        matched:
          type: boolean
        facts:
          type: object
          additionalProperties: true
          description: Values of the fields the condition references, for this event.
    RiskSettings:
      type: object
      additionalProperties: false
      required: [weights, high_value_default, high_value_by_currency, fail_policies]
      properties:
        weights:
          type: object
          description: Overrides of built-in signal weights (0-50), keyed by signal code.
          additionalProperties:
            type: integer
            minimum: 0
            maximum: 50
        high_value_default:
          type: integer
          format: int64
          minimum: 1
          description: |
            High-value threshold in minor units for currencies without their own entry. While any
            signal source is degraded, events at or above it get at least REVIEW.
          example: 1000000
        high_value_by_currency:
          type: object
          additionalProperties:
            type: integer
            format: int64
            minimum: 1
          example:
            USD: 500000
        fail_policies:
          type: object
          description: |
            What a degraded evaluation falls back to, per event type: `closed` (at least REVIEW)
            or `open` (allow, flagged). Types not listed fail closed.
          additionalProperties:
            type: string
            enum: [open, closed]
          example:
            transaction: closed
            login: open
        thresholds:
          $ref: "#/components/schemas/RiskThresholds"
        alert_min_decision:
          type: string
          enum: [step_up, review]
          default: review
          description: |
            The least severe decision that raises an alert. Always present in responses; when
            omitted from a PUT, `review` is stored.
        auto_block:
          $ref: "#/components/schemas/AutoBlock"
          description: |
            Automatic blocking of Critical scores. Always present in responses; when omitted from
            a PUT, the current mode is kept. Switching it on requires 14 days in shadow mode.
    RiskCatalog:
      type: object
      additionalProperties: false
      required: [engine_version, signals, fields]
      properties:
        engine_version:
          type: string
        signals:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, label, default_weight, weight, source, strengthenable]
            properties:
              code:
                type: string
              label:
                type: string
              default_weight:
                type: integer
              weight:
                type: integer
                description: Effective weight in the caller's environment.
              source:
                type: string
                enum: [history, velocity, network]
              strengthenable:
                type: boolean
                description: Whether the signal turns a Low-band score into STEP_UP.
        fields:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, type, operators]
            properties:
              name:
                type: string
              type:
                type: string
                enum: [number, string, boolean]
              operators:
                type: array
                items:
                  type: string

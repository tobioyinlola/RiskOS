      properties:
        transaction_id:
          $ref: "#/components/schemas/Reference"
        amount:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000000000
          description: Amount in minor units of the currency (e.g. cents).
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: ISO 4217 code.
        direction:
          type: string
          enum: [debit, credit]
        beneficiary_id:
          $ref: "#/components/schemas/Reference"
        channel:

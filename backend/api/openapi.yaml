      description: |
        Where the end user was, for impossible-travel checks (BEH-02). RiskOS rounds it to 2
        decimals (about 1 km) before storing it.
      properties:
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
        lon:
          type: number
          format: double
          minimum: -180
          maximum: 180
    LoginData:

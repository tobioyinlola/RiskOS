      required: [change]
      properties:
        change:
          type: string
          enum: [created, refreshed, terminated]
    ProfileChangeData:
      type: object
      additionalProperties: false
      required: [fields]
      properties:
        fields:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items:
            type: string
            enum: [email, phone, address, name, password]
    RiskLevel:
      type: string
      description: |
        The risk band of a score: minimal, low, elevated, high, critical (default thresholds
        20/50/70/90, adjustable per environment; see `GET /api/v1/risk/policy`).
      enum: [minimal, low, elevated, high, critical]
    RiskThresholds:
      type: object
      additionalProperties: false
      required: [low, elevated, high, critical]
      description: Lowest score of each band above minimal; must increase strictly. Always present in responses; when omitted from a PUT, the defaults are stored.
      properties:
        low:
          type: integer
          minimum: 1
          maximum: 100
          example: 20
        elevated:
          type: integer
          minimum: 1
          maximum: 100
          example: 50
        high:
          type: integer
          minimum: 1
          maximum: 100
          example: 70
        critical:
          type: integer
          minimum: 1
          maximum: 100
          example: 90
    RiskPolicy:
      type: object
      additionalProperties: false
      required: [engine_version, thresholds, custom_calibration, alert_min_decision, bands, auto_block]
      properties:
        engine_version:
          type: string
        auto_block:
          $ref: "#/components/schemas/AutoBlockStatus"
        thresholds:
          $ref: "#/components/schemas/RiskThresholds"
        custom_calibration:
          type: boolean
          description: True when the environment's thresholds differ from the defaults.
        alert_min_decision:
          type: string
          enum: [step_up, review]
        bands:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [band, min_score, max_score, default_decision]
            properties:
              band:
                $ref: "#/components/schemas/RiskLevel"
              min_score:
                type: integer
              max_score:
                type: integer
              default_decision:
                $ref: "#/components/schemas/Decision"
    Decision:
      type: string
      enum: [allow, fee, flag, step_up, review, restrict, hold, block_session, decline, block]
      description: |
        The recommended action, from least to most severe. The score policy produces `allow`,
        `step_up`, `review` and `block` (`block` only for a deny-list match or for Critical scores
        where automatic blocking is on). A regulatory control of the workspace's rule pack sets
        the action the law requires (see `controls` on the decision):
        - `fee`: allow, and charge the regulatory fee given in the control;
        - `flag`: allow, and do the follow-up the control names;
        - `restrict`: limit the account until the requirement is met;
        - `hold`: hold the funds for review, for at most the control's hold period;
        - `block_session`: end the session and require fresh authentication;
        - `decline`: decline this transaction (a legal limit);
        - `block`: stop the event.
        The most severe applicable action is returned. Clients that switch on the decision must
        handle every value.
    AutoBlockMode:
      type: string
      enum: ["off", shadow, "on"]
      description: |
        `off`: Critical scores get REVIEW. `shadow`: they still get REVIEW, and the evaluation is
        marked `would_block` in its policy reasons, to gather evidence. `on`: they get BLOCK
        (possible only after 14 days in shadow). Switching to `off` or `shadow` takes effect at
        once: it is the kill switch.
    AutoBlock:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          $ref: "#/components/schemas/AutoBlockMode"
        shadow_since:
          type: string
          format: date-time
          nullable: true
          description: When shadow evidence started (kept while blocking is on). Set by the server; ignored in a PUT.
    AutoBlockStatus:
      type: object
      additionalProperties: false
      required: [mode, shadow_since, shadow_days_required, eligible_at, would_block_last_14_days]
      properties:
        mode:
          $ref: "#/components/schemas/AutoBlockMode"
        shadow_since:
          type: string
          format: date-time
          nullable: true
        shadow_days_required:
          type: integer
          description: Days in shadow mode before blocking can be switched on.
        eligible_at:
          type: string
          format: date-time
          nullable: true
          description: From when blocking can be switched on (null when not in shadow or on).
        would_block_last_14_days:
          type: integer
          description: Evaluations in the last 14 days that blocking would have blocked.
    Signal:
      type: object
      additionalProperties: false
      required: [code, label, weight]
      properties:
        code:
          type: string
          example: new_device
        label:
          type: string
          example: New device
        weight:
          type: integer
          minimum: 0
          maximum: 100
    RiskDecision:
      type: object
      additionalProperties: false
      description: |
        The risk response (spec §7). risk_score is the sum of the listed signal weights, capped at
        100. degraded_signals lists sources that could not be evaluated for this event.
        warming_signals lists history signals held back while behavioural history rebuilds after
        RiskOS lost it (see docs/DISASTER_RECOVERY.md); it is empty otherwise.
      required: [request_id, event_id, evaluation_id, risk_score, risk_level, decision, engine_version, signals, degraded_signals, warming_signals, controls, not_evaluated]
      properties:
        request_id:
          type: string
          description: The request that produced this decision (for replays, the original request).
        event_id:
          type: string
          nullable: true
          description: RiskOS ID of the stored event; null for dry runs.
          example: evt_01j9x2k7m3q4r5s6t7v8w9x0yz
        evaluation_id:
          type: string
          example: evl_01j9x2k7m3q4r5s6t7v8w9x0yz
        risk_score:
          type: integer
          minimum: 0
          maximum: 100
        risk_level:
          $ref: "#/components/schemas/RiskLevel"
        decision:
          $ref: "#/components/schemas/Decision"
        engine_version:
          type: string
          example: risk-engine-2.0.0
        signals:
          type: array
          items:
            $ref: "#/components/schemas/Signal"
        degraded_signals:
          type: array
          items:
            type: string
        warming_signals:
          type: array
          items:
            type: string
        controls:
          type: array
          description: |
            The regulatory controls of the workspace's rule pack that applied to the event (see the
            console's Rules library). A live control's decision is reflected in `decision`; a shadow
            control is reported only. Empty without a compliance profile.
          items:
            $ref: "#/components/schemas/ControlResult"
        not_evaluated:
          type: array
          description: |
            Rules of the pack the event triggered that could not be evaluated because data or a
            setting they need was unavailable. Missing data is never treated as no risk: send the
            listed facts in the event's `compliance` block, or set the listed settings.
          items:
            $ref: "#/components/schemas/NotEvaluatedRule"
    ControlResult:
      type: object
      additionalProperties: false
      required: [rule, name, mode, reason, tasks, exemption_unknown]
      properties:
        rule:
          type: string
          example: REG-01
        name:
          type: string
        mode:
          type: string
          enum: [live, shadow]
        decision:
          $ref: "#/components/schemas/Decision"
        reason:
          type: string
        tasks:
          type: array
          description: What the institution must do (report.CTR, case.open, edd...).
          items:
            type: string
        fee_percent:
          type: number
          format: double
        hold_seconds:
          type: integer
          format: int64
          description: The longest the funds may be held.
        branch:
          type: string
        exemption_unknown:
          type: boolean
          description: The control applied because its exemption could not be checked.
    NotEvaluatedRule:
      type: object
      additionalProperties: false
      required: [rule, missing]
      properties:
        rule:
          type: string
          example: ATO-04
        missing:
          type: array
          description: |
            What was unavailable: `fact:<name>` (send it in `compliance.facts`), `setting:<name>`
            (set it for the rule), `history:<window>` (behaviour history, or a reference the window
            is kept for) or `currency:<fact>` (an amount in another currency than the rule's).
          items:
            type: string
    EventSummary:
      type: object
      additionalProperties: false
      required: [id, event_key, type, occurred_at, received_at, risk_score, risk_level, decision]
      properties:
        id:
          type: string
        event_key:
          type: string
        type:
          $ref: "#/components/schemas/EventType"
        occurred_at:
          type: string
          format: date-time
        received_at:
          type: string
          format: date-time
        risk_score:
          type: integer
        risk_level:
          $ref: "#/components/schemas/RiskLevel"
        decision:
          $ref: "#/components/schemas/Decision"
        actor:
          $ref: "#/components/schemas/EventActorRefs"
        country:
          type: string
          nullable: true
        transaction:
          $ref: "#/components/schemas/TransactionSummary"
    EventActorRefs:
      type: object
      additionalProperties: false
      required: [user_id]
      properties:
        user_id:
          type: string
        account_id:
          type: string
          nullable: true
        device_id:
          type: string
          nullable: true
    TransactionSummary:
      type: object
      nullable: true
      additionalProperties: false
      description: For transactions, the fields an analyst scans for.
      required: [amount, currency, direction]
      properties:
        amount:
          type: integer
          format: int64
          description: Minor units.
        currency:
          type: string
        direction:
          type: string
        beneficiary_id:
          type: string
          nullable: true
        channel:
          type: string
          nullable: true
    LinkedEntity:
      type: object
      additionalProperties: false
      required: [ref, events, last_seen]
      properties:
        ref:
          type: string
        events:
          type: integer
        last_seen:
          type: string
          format: date-time
    DecisionCounts:
      type: object
      additionalProperties: false
      required: [allow, fee, flag, step_up, review, restrict, hold, block_session, decline, block]
      properties:
        allow:
          type: integer
        fee:
          type: integer
        flag:
          type: integer
        step_up:
          type: integer
        review:
          type: integer
        restrict:
          type: integer
        hold:
          type: integer
        block_session:
          type: integer
        decline:
          type: integer
        block:
          type: integer
    EntityProfile:
      type: object
      additionalProperties: false
      required: [kind, ref, event_count, first_seen, last_seen, max_score, mean_score, decisions, linked]
      properties:
        kind:
          type: string
          enum: [user, account, device]
        ref:
          type: string
        event_count:
          type: integer
          description: Events in the profile (at most the most recent 5,000).
        first_seen:
          type: string
          format: date-time
        last_seen:
          type: string
          format: date-time
        max_score:
          type: integer
        mean_score:
          type: integer
        decisions:
          $ref: "#/components/schemas/DecisionCounts"
        linked:
          $ref: "#/components/schemas/EntityLinks"
    EntityLinks:
      type: object
      additionalProperties: false
      required: [users, accounts, devices, countries, ips]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/LinkedEntity"
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/LinkedEntity"
        devices:
          type: array
          items:
            $ref: "#/components/schemas/LinkedEntity"
        countries:
          type: array
          items:
            $ref: "#/components/schemas/LinkedEntity"
        ips:
          type: array
          items:
            $ref: "#/components/schemas/LinkedEntity"
    Analytics:
      type: object
      additionalProperties: false
      required: [window, bucket, since, series, top_users, top_signals]
      properties:
        window:
          type: string
          enum: [24h, 7d, 30d]
        bucket:
          type: string
          enum: [hour, day]
        since:
          type: string
          format: date-time
        series:
          type: array

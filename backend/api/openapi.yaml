openapi: 3.0.3
info:
  title: RiskOS API
  version: 0.6.0
  description: |
    RiskOS public HTTP contract. This file is the single source of truth: Go server stubs and the
    TypeScript client are generated from it (`make generate`), and CI fails if generated code drifts.

    **Authentication.** Every `/api/v1` operation requires an API key sent as
    `Authorization: Bearer rsk_test_…` (test environment) or `rsk_live_…` (production). The key
    determines the tenant and environment; no request field can change them. A key can only act
    within its own environment and only with the scopes it holds.

    **Errors** use one contract: `{"error":{"code","message","request_id"}}`.

    **Idempotency.** `POST /api/v1/events` is idempotent on the event's `event_id` within the
    key's environment. Retrying with the same payload returns the original response with the
    header `Idempotent-Replay: true`; the same `event_id` with a different payload is rejected with
    `409 IDEMPOTENCY_CONFLICT`.

    **Rate limits.** Requests are limited per API key and per tenant. Excess requests get
    `429 RATE_LIMITED` with `Retry-After` (seconds).

    **Pagination.** List operations return `data` and `next_cursor`. Pass `next_cursor` back as
    `cursor` to get the next page; `next_cursor` is null on the last page. Results are newest first.
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: health
    description: Liveness and readiness probes for orchestrators and load balancers.
  - name: auth
    description: The calling credential and API key management.
  - name: audit
    description: The tenant's tamper-evident audit trail.
  - name: events
    description: Event ingestion with a synchronous risk decision, and the event explorer.
  - name: risk
    description: Risk evaluation without ingestion, the signal catalog and risk settings.
  - name: rules
    description: Customer rules, versioned, testable and reversible.
  - name: alerts
    description: Alerts raised from risk decisions and degraded evaluations, and their triage.
  - name: cases
    description: Investigation cases grouping alerts, with notes and a resolution.
  - name: webhooks
    description: Signed notifications to customer endpoints, with delivery logs and retries.
security:
  - apiKey: []
paths:
  /health/live:
    get:
      operationId: getLiveness
      tags: [health]
      summary: Liveness probe
      security: []
      description: Returns 200 while the process is running and able to serve HTTP. Performs no dependency checks.
      responses:
        "200":
          description: Process is alive.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessResponse"
        default:
          $ref: "#/components/responses/DefaultError"
  /health/ready:
    get:
      operationId: getReadiness
      tags: [health]
      summary: Readiness probe
      security: []
      description: |
        Returns 200 when every required dependency (PostgreSQL, Redis) answered within its check
        timeout, and 503 otherwise, including while the server is draining during shutdown.
        Per-dependency status is reported without internal error details.
      responses:
        "200":
          description: Ready to receive traffic.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: Not ready; at least one dependency is unavailable or the server is draining.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/whoami:
    get:
      operationId: getWhoami
      tags: [auth]
      summary: Describe the calling credential
      description: Returns the tenant, environment and scopes the presented API key resolves to. Requires no scope.
      responses:
        "200":
          description: The authenticated credential.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Whoami"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/api-keys:
    get:
      operationId: listAPIKeys
      tags: [auth]
      summary: List API keys of the caller's environment
      description: Requires scope `api_keys:read`. Secrets are never returned.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of API keys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/DefaultError"
    post:
      operationId: createAPIKey
      tags: [auth]
      summary: Create an API key in the caller's environment
      description: |
        Requires scope `api_keys:write`. The new key can only receive scopes the caller holds.
        The secret is returned **once**, in this response; store it immediately.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequest"
      responses:
        "201":
          description: Created. Contains the only copy of the secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyWithSecret"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/api-keys/{key_id}/rotate:
    post:
      operationId: rotateAPIKey
      tags: [auth]
      summary: Rotate an API key
      description: |
        Requires scope `api_keys:write` and every scope of the rotated key. Creates a replacement
        with the same name and scopes and returns its secret once. The old key keeps working for
        the overlap window, then expires. A revoked or already-rotated key cannot be rotated.
      parameters:
        - $ref: "#/components/parameters/KeyId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RotateApiKeyRequest"
      responses:
        "201":
          description: The replacement key. Contains the only copy of its secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyWithSecret"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/api-keys/{key_id}/revoke:
    post:
      operationId: revokeAPIKey
      tags: [auth]
      summary: Revoke an API key
      description: |
        Requires scope `api_keys:write`. Takes effect within seconds on every instance. Revoking an
        already revoked key returns it unchanged.
      parameters:
        - $ref: "#/components/parameters/KeyId"
      responses:
        "200":
          description: The revoked key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKey"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/audit-logs:
    get:
      operationId: listAuditLogs
      tags: [audit]
      summary: List audit entries
      description: |
        Requires scope `audit_logs:read`. Returns tenant-level entries and entries of the caller's
        environment. Each entry carries its position in the tenant's hash chain.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of audit entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/events:
    post:
      operationId: ingestEvent
      tags: [events]
      summary: Ingest an event and get its risk decision
      description: |
        Requires scope `events:write`. Validates, normalizes and stores the event, evaluates it
        and returns the decision in the same response. Idempotent on `event_id` (see above).
        Timestamps must be at most 5 minutes in the future and 24 hours in the past.
        Card numbers, CVVs, PINs and passwords must never be sent; payloads containing
        card-number-like values are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Event"
      responses:
        "200":
          description: "The risk decision. Replays carry `Idempotent-Replay: true`."
          headers:
            Idempotent-Replay:
              schema:
                type: string
                enum: ["true"]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskDecision"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"
    get:
      operationId: listEvents
      tags: [events]
      summary: List events of the caller's environment
      description: Requires scope `events:read`. Newest first.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/events/{event_id}:
    get:
      operationId: getEvent
      tags: [events]
      summary: Get an event with its payloads and evaluation
      description: Requires scope `events:read`.
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
            example: evt_01j9x2k7m3q4r5s6t7v8w9x0yz
      responses:
        "200":
          description: The event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/risk/evaluate:
    post:
      operationId: evaluateRisk
      tags: [risk]
      summary: Evaluate an event without ingesting it (dry run)
      description: |
        Requires scope `risk:evaluate`. Runs the same validation and evaluation as ingestion but
        stores no event; the evaluation is recorded as a dry run and never raises alerts or
        webhooks. Not idempotent: every call is evaluated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Event"
      responses:
        "200":
          description: The risk decision (event_id is null).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskDecision"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/risk/catalog:
    get:
      operationId: getRiskCatalog
      tags: [risk]
      summary: Built-in signals and the fields rules can use
      description: Requires scope `rules:read`. Includes each signal's default and effective weight for the caller's environment.
      responses:
        "200":
          description: The catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskCatalog"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/risk/settings:
    get:
      operationId: getRiskSettings
      tags: [risk]
      summary: Get the environment's risk settings
      description: Requires scope `risk:configure`. Returns product defaults until settings are saved.
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskSettings"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"
    put:
      operationId: putRiskSettings
      tags: [risk]
      summary: Replace the environment's risk settings
      description: |
        Requires scope `risk:configure`. Audited. Built-in signal weights may be tuned between 0
        and 50; changes apply within seconds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RiskSettings"
      responses:
        "200":
          description: The stored settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskSettings"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/rules:
    get:
      operationId: listRules
      tags: [rules]
      summary: List rules with their current versions
      description: Requires scope `rules:read`.
      responses:
        "200":
          description: The rules, by code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"
    post:
      operationId: createRule
      tags: [rules]
      summary: Create a rule
      description: |
        Requires scope `rules:write`. Audited. Start new rules in `shadow` mode: they are evaluated
        on live traffic and recorded, but do not change decisions until switched to `active`.
        Returns 409 when the code is taken or the environment already has 200 rules (disabled
        rules count; rules are disabled, never deleted).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRuleRequest"
      responses:
        "201":
          description: The created rule (version 1).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/rules/{rule_id}:
    get:
      operationId: getRule
      tags: [rules]
      summary: Get a rule
      description: Requires scope `rules:read`.
      parameters:
        - name: rule_id
          in: path
          required: true
          schema:
            type: string
            example: rul_01j9x2k7m3q4r5s6t7v8w9x0yz
      responses:
        "200":
          description: The rule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"
    patch:
      operationId: updateRule
      tags: [rules]
      summary: Change a rule (creates a new version)
      description: |
        Requires scope `rules:write`. Audited. Only the given fields change. Every change creates a
        new version; earlier versions are kept and can be restored. A change that alters nothing
        creates no version.
      parameters:
        - name: rule_id
          in: path
          required: true
          schema:
            type: string
            example: rul_01j9x2k7m3q4r5s6t7v8w9x0yz
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRuleRequest"
      responses:
        "200":
          description: The rule with its (possibly new) current version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/rules/{rule_id}/versions:
    get:
      operationId: listRuleVersions
      tags: [rules]
      summary: A rule's version history
      description: Requires scope `rules:read`. Newest first.
      parameters:
        - name: rule_id
          in: path
          required: true
          schema:
            type: string
            example: rul_01j9x2k7m3q4r5s6t7v8w9x0yz
      responses:
        "200":
          description: The versions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleVersionList"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/rules/{rule_id}/rollback:
    post:
      operationId: rollbackRule
      tags: [rules]
      summary: Restore an earlier version (one-step rollback)
      description: |
        Requires scope `rules:write`. Audited. Adds a new version with the content of the given
        version; history is never rewritten.
      parameters:
        - name: rule_id
          in: path
          required: true
          schema:
            type: string
            example: rul_01j9x2k7m3q4r5s6t7v8w9x0yz
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RollbackRuleRequest"
      responses:
        "200":
          description: The rule with the restored content as its new current version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/rules/{rule_id}/test:
    post:
      operationId: testRule
      tags: [rules]
      summary: Test a rule against an event
      description: |
        Requires scope `rules:read`. Evaluates the rule's current condition, or a draft
        `condition`, against the event using the environment's live features without changing
        them. Nothing is stored. Returns whether it matched and the values of the fields the
        condition uses.
      parameters:
        - name: rule_id
          in: path
          required: true
          schema:
            type: string
            example: rul_01j9x2k7m3q4r5s6t7v8w9x0yz
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestRuleRequest"
      responses:
        "200":
          description: The test result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestRuleResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/alerts:
    get:
      operationId: listAlerts
      tags: [alerts]
      summary: List alerts, newest first
      description: Requires scope `alerts:read`.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AlertStatus"
        - name: kind
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AlertKind"
      responses:
        "200":
          description: A page of alerts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/alerts/{alert_id}:
    get:
      operationId: getAlert
      tags: [alerts]
      summary: Get an alert with its evaluations and timeline
      description: Requires scope `alerts:read`. Returns the newest 100 evaluations the alert groups.
      parameters:
        - name: alert_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
            example: alr_01j9x2k7m3q4r5s6t7v8w9x0yz
      responses:
        "200":
          description: The alert.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"
    patch:
      operationId: updateAlert
      tags: [alerts]
      summary: Triage an alert (status, assignee, note)
      description: |
        Requires scope `alerts:write`. Audited. Allowed status changes: `open` and `investigating`
        to any of `open`, `investigating`, `false_positive`, `resolved`. `false_positive` and
        `resolved` are final. Alerts are escalated by creating a case with them
        (`POST /api/v1/cases`); an escalated alert is closed by resolving its case. An empty
        `assignee` unassigns. A change that alters nothing is a no-op.
      parameters:
        - name: alert_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
            example: alr_01j9x2k7m3q4r5s6t7v8w9x0yz
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAlertRequest"
      responses:
        "200":
          description: The alert.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/cases:
    get:
      operationId: listCases
      tags: [cases]
      summary: List cases, newest first
      description: Requires scope `cases:read`.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/CaseStatus"
      responses:
        "200":
          description: A page of cases.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"
    post:
      operationId: createCase
      tags: [cases]
      summary: Open a case, optionally escalating alerts into it
      description: |
        Requires scope `cases:write`, and `alerts:write` when `alert_ids` are given. Audited. Every
        listed alert must be `open` or `investigating`; they become `escalated`. Without a
        `priority`, the case takes the highest severity of its alerts (`medium` without alerts).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCaseRequest"
      responses:
        "201":
          description: The case.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/cases/{case_id}:
    get:
      operationId: getCase
      tags: [cases]
      summary: Get a case with its alerts, notes and timeline
      description: Requires scope `cases:read`.
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
            example: cas_01j9x2k7m3q4r5s6t7v8w9x0yz
      responses:
        "200":
          description: The case.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"
    patch:
      operationId: updateCase
      tags: [cases]
      summary: Update or resolve a case
      description: |
        Requires scope `cases:write`. Audited. Resolving (`status: resolved`) requires a
        `resolution` and closes the case's alerts: `false_positive` when the resolution is
        `false_positive`, otherwise `resolved`. A resolved case is final; notes can still be added.
        An empty `assignee` unassigns.
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
            example: cas_01j9x2k7m3q4r5s6t7v8w9x0yz
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCaseRequest"
      responses:
        "200":
          description: The case.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/cases/{case_id}/notes:
    post:
      operationId: addCaseNote
      tags: [cases]
      summary: Add a note to a case
      description: |
        Requires scope `cases:write`. Notes are append-only: they cannot be edited or deleted. Do
        not put card numbers, passwords or other secrets in notes.
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
            example: cas_01j9x2k7m3q4r5s6t7v8w9x0yz
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCaseNoteRequest"
      responses:
        "201":
          description: The note.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseNote"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/webhooks:
    get:
      operationId: listWebhooks
      tags: [webhooks]
      summary: List webhook endpoints
      description: |
        Requires scope `webhooks:read`.
      responses:
        "200":
          description: The environment's endpoints, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"
    post:
      operationId: createWebhook
      tags: [webhooks]
      summary: Register a webhook endpoint
      description: |
        Requires scope `webhooks:write`. Audited. The response contains the endpoint's signing secret,
        shown only this once. URLs must use https and must not point to localhost or private,
        loopback, link-local or reserved addresses (also checked after DNS resolution on every
        delivery). At most 20 endpoints per environment (409 beyond).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWebhookRequest"
      responses:
        "201":
          description: The endpoint and its secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookWithSecret"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/webhooks/{webhook_id}:
    get:
      operationId: getWebhook
      tags: [webhooks]
      summary: Get a webhook endpoint
      description: |
        Requires scope `webhooks:read`. Never returns the secret.
      parameters:
        - name: webhook_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
            example: whk_01j9x2k7m3q4r5s6t7v8w9x0yz
      responses:
        "200":
          description: The endpoint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Webhook"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"
    patch:
      operationId: updateWebhook
      tags: [webhooks]
      summary: Change or enable/disable a webhook endpoint
      description: |
        Requires scope `webhooks:write`. Audited. Setting `status: active` re-enables an endpoint
        disabled after failing, and clears its failure state.
      parameters:
        - name: webhook_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
            example: whk_01j9x2k7m3q4r5s6t7v8w9x0yz
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWebhookRequest"
      responses:
        "200":
          description: The endpoint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Webhook"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/webhooks/{webhook_id}/rotate-secret:
    post:
      operationId: rotateWebhookSecret
      tags: [webhooks]
      summary: Rotate a webhook endpoint's signing secret
      description: |
        Requires scope `webhooks:write`. Audited. Returns the new secret, shown only this once.
        Until the overlap ends, deliveries carry signatures from both the new and the previous
        secret, so receivers can switch without dropping events.
      parameters:
        - name: webhook_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
            example: whk_01j9x2k7m3q4r5s6t7v8w9x0yz
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RotateWebhookSecretRequest"
      responses:
        "200":
          description: The endpoint and its new secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookWithSecret"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/webhooks/{webhook_id}/test:
    post:
      operationId: testWebhook
      tags: [webhooks]
      summary: Send a test event to an endpoint
      description: |
        Requires scope `webhooks:write`. Queues a `webhook.test` event for this endpoint only.
      parameters:
        - name: webhook_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
            example: whk_01j9x2k7m3q4r5s6t7v8w9x0yz
      responses:
        "202":
          description: The queued delivery.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDelivery"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/webhooks/{webhook_id}/deliveries:
    get:
      operationId: listWebhookDeliveries
      tags: [webhooks]
      summary: List an endpoint's deliveries, newest first
      description: |
        Requires scope `webhooks:read`.
      parameters:
        - name: webhook_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
            example: whk_01j9x2k7m3q4r5s6t7v8w9x0yz
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/WebhookDeliveryStatus"
      responses:
        "200":
          description: A page of deliveries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDeliveryList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/webhooks/{webhook_id}/deliveries/{delivery_id}:
    get:
      operationId: getWebhookDelivery
      tags: [webhooks]
      summary: Get a delivery with its payload and every attempt
      description: |
        Requires scope `webhooks:read`.
      parameters:
        - name: webhook_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
            example: whk_01j9x2k7m3q4r5s6t7v8w9x0yz
        - name: delivery_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
            example: whd_01j9x2k7m3q4r5s6t7v8w9x0yz
      responses:
        "200":
          description: The delivery.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDeliveryDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/webhooks/{webhook_id}/deliveries/{delivery_id}/redeliver:
    post:
      operationId: redeliverWebhook
      tags: [webhooks]
      summary: Retry a failed delivery
      description: |
        Requires scope `webhooks:write`. Audited. Starts a new delivery cycle for a `failed` delivery
        to an active endpoint. The event keeps its ID.
      parameters:
        - name: webhook_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
            example: whk_01j9x2k7m3q4r5s6t7v8w9x0yz
        - name: delivery_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
            example: whd_01j9x2k7m3q4r5s6t7v8w9x0yz
      responses:
        "202":
          description: The delivery, pending again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDelivery"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: "API key: `rsk_test_…` or `rsk_live_…`."
  headers:
    XRequestID:
      description: |
        Correlation ID for this request. Echoes a caller-supplied `X-Request-ID` when it is 1-64
        characters of `[A-Za-z0-9._-]`; otherwise a server-generated `req_…` ID.
      schema:
        type: string
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: The `next_cursor` of the previous page.
      schema:
        type: string
        maxLength: 64
    KeyId:
      name: key_id
      in: path
      required: true
      schema:
        type: string
        example: key_01j9x2k7m3q4r5s6t7v8w9x0yz
  responses:
    DefaultError:
      description: Error in the standard RiskOS error contract (spec §7).
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InvalidRequest:
      description: "`INVALID_REQUEST`: the request is malformed or fails validation."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthenticated:
      description: "`UNAUTHENTICATED`: the API key is missing, malformed, unknown, revoked or expired. The response never says which."
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: "`FORBIDDEN`: the key lacks a required scope. `TENANT_SUSPENDED`: the tenant is not active."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: "`NOT_FOUND`: the resource does not exist in the caller's environment. Resources of other tenants or environments are indistinguishable from nonexistent ones."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: "`CONFLICT`: the resource is not in a state that allows the operation. `IDEMPOTENCY_CONFLICT`: the event_id was already used with a different payload."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unprocessable:
      description: "`STALE_EVENT`: occurred_at is outside the accepted window. `INVALID_EVENT`: the event is well-formed but semantically invalid. `SENSITIVE_DATA`: the payload contains data that must never be sent (e.g. a card number)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: "`RATE_LIMITED`: too many requests for this API key or tenant."
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    WebhookEventType:
      type: string
      enum: [alert.created, alert.updated, case.created, case.resolved]
    Webhook:
      type: object
      additionalProperties: false
      required: [id, url, description, event_types, status, disabled_reason, failing_since, previous_secret_valid_until, created_at, created_by, updated_at]
      properties:
        id:
          type: string
          example: whk_01j9x2k7m3q4r5s6t7v8w9x0yz
        url:
          type: string
        description:
          type: string
        event_types:
          type: array
          items:
            $ref: "#/components/schemas/WebhookEventType"
        status:
          type: string
          enum: [active, disabled]
        disabled_reason:
          type: string
          nullable: true
        failing_since:
          type: string
          format: date-time
          nullable: true
          description: When the current run of failed attempts started. After 3 days the endpoint is disabled.
        previous_secret_valid_until:
          type: string
          format: date-time
          nullable: true
          description: End of the current rotation overlap, if any.
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
        updated_at:
          type: string
          format: date-time
    WebhookList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Webhook"
    WebhookWithSecret:
      type: object
      additionalProperties: false
      required: [webhook, secret]
      properties:
        webhook:
          $ref: "#/components/schemas/Webhook"
        secret:
          type: string
          description: The signing secret. Shown only in this response; store it in a secrets manager.
          example: whsec_3q2-7wEAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
    CreateWebhookRequest:
      type: object
      additionalProperties: false
      required: [url, event_types]
      properties:
        url:
          type: string
          maxLength: 2048
          example: https://hooks.example.com/riskos
        description:
          type: string
          maxLength: 500
        event_types:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: "#/components/schemas/WebhookEventType"
    UpdateWebhookRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        url:
          type: string
          maxLength: 2048
        description:
          type: string
          maxLength: 500
        event_types:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: "#/components/schemas/WebhookEventType"
        status:
          type: string
          enum: [active, disabled]
    RotateWebhookSecretRequest:
      type: object
      additionalProperties: false
      properties:
        overlap_hours:
          type: integer
          minimum: 0
          maximum: 168
          default: 24
          description: How long the previous secret keeps signing deliveries.
    WebhookDeliveryStatus:
      type: string
      enum: [pending, succeeded, failed]
    WebhookDelivery:
      type: object
      additionalProperties: false
      required: [id, webhook_id, event_id, event_type, status, attempts, next_attempt_at, last_attempt_at, last_status_code, last_error, created_at, completed_at]
      properties:
        id:
          type: string
          example: whd_01j9x2k7m3q4r5s6t7v8w9x0yz
        webhook_id:
          type: string
        event_id:
          type: string
          description: The event's ID (`RiskOS-Webhook-Id`), the same for every endpoint and every retry.
          example: wev_01j9x2k7m3q4r5s6t7v8w9x0yz
        event_type:
          type: string
          example: alert.created
        status:
          $ref: "#/components/schemas/WebhookDeliveryStatus"
        attempts:
          type: integer
          description: Attempts in the current delivery cycle (at most 9 over about an hour).
        next_attempt_at:
          type: string
          format: date-time
          nullable: true
        last_attempt_at:
          type: string
          format: date-time
          nullable: true
        last_status_code:
          type: integer
          nullable: true
        last_error:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
    WebhookDeliveryList:
      type: object
      additionalProperties: false
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/WebhookDelivery"
        next_cursor:
          type: string
          nullable: true
    WebhookAttempt:
      type: object
      additionalProperties: false
      required: [attempt, started_at, duration_ms, status_code, error]
      properties:
        attempt:
          type: integer
        started_at:
          type: string
          format: date-time
        duration_ms:
          type: integer
        status_code:
          type: integer
          nullable: true
        error:
          type: string
          nullable: true
          description: A short reason such as `timeout` or `http status 500`. Response bodies are never stored.
    WebhookDeliveryDetail:
      type: object
      additionalProperties: false
      required: [delivery, payload, attempts]
      properties:
        delivery:
          $ref: "#/components/schemas/WebhookDelivery"
        payload:
          type: object
          additionalProperties: true
          description: The exact JSON body sent (signatures cover its bytes as sent).
        attempts:
          type: array
          items:
            $ref: "#/components/schemas/WebhookAttempt"
    AlertKind:
      type: string
      description: "`risk`: an evaluation reached the alert threshold. `security`: evaluations ran with missing signals."
      enum: [risk, security]
    AlertStatus:
      type: string
      enum: [open, investigating, escalated, false_positive, resolved]
    Alert:
      type: object
      additionalProperties: false
      required: [id, kind, subject, title, severity, status, assignee, case_id, max_score, evaluation_count, first_seen_at, last_seen_at, created_at, updated_at]
      properties:
        id:
          type: string
          example: alr_01j9x2k7m3q4r5s6t7v8w9x0yz
        kind:
          $ref: "#/components/schemas/AlertKind"
        subject:
          type: object
          additionalProperties: false
          required: [type, ref]
          description: "What the alert is about: the customer's user reference, or the environment for security alerts."
          properties:
            type:
              type: string
              enum: [user, environment]
              x-enum-varnames: [AlertSubjectUser, AlertSubjectEnvironment]
            ref:
              type: string
        title:
          type: string
        severity:
          $ref: "#/components/schemas/Severity"
        status:
          $ref: "#/components/schemas/AlertStatus"
        assignee:
          type: string
          nullable: true
        case_id:
          type: string
          nullable: true
        max_score:
          type: integer
          minimum: 0
          maximum: 100
        evaluation_count:
          type: integer
          description: Evaluations grouped into this alert (same subject, each within an hour of the previous).
        first_seen_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AlertList:
      type: object
      additionalProperties: false
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Alert"
        next_cursor:
          type: string
          nullable: true
    AlertEvaluation:
      type: object
      additionalProperties: false
      required: [evaluation_id, event_id, event_type, risk_score, risk_level, decision, signals, degraded_signals, evaluated_at]
      properties:
        evaluation_id:
          type: string
        event_id:
          type: string
        event_type:
          $ref: "#/components/schemas/EventType"
        risk_score:
          type: integer
        risk_level:
          $ref: "#/components/schemas/RiskLevel"
        decision:
          $ref: "#/components/schemas/Decision"
        signals:
          type: array
          items:
            $ref: "#/components/schemas/Signal"
        degraded_signals:
          type: array
          items:
            type: string
        evaluated_at:
          type: string
          format: date-time
    ActivityEntry:
      type: object
      additionalProperties: false
      required: [id, action, actor, detail, created_at]
      properties:
        id:
          type: string
        action:
          type: string
          example: updated
        actor:
          type: string
          description: The API key or system job that acted.
        detail:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
    AlertDetail:
      type: object
      additionalProperties: false
      required: [alert, evaluations, activity]
      properties:
        alert:
          $ref: "#/components/schemas/Alert"
        evaluations:
          type: array
          items:
            $ref: "#/components/schemas/AlertEvaluation"
        activity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityEntry"
    UpdateAlertRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        status:
          type: string
          enum: [open, investigating, false_positive, resolved]
        assignee:
          type: string
          maxLength: 254
          description: Free-text reference to the analyst (for example an email or staff ID); empty to unassign.
        note:
          type: string
          maxLength: 2000
          description: Recorded in the alert's timeline.
    CaseStatus:
      type: string
      enum: [open, investigating, resolved]
    CaseResolution:
      type: string
      enum: [confirmed_fraud, false_positive, legitimate, inconclusive]
    Case:
      type: object
      additionalProperties: false
      required: [id, title, description, status, priority, assignee, resolution, resolution_note, resolved_at, resolved_by, created_at, created_by, updated_at]
      properties:
        id:
          type: string
          example: cas_01j9x2k7m3q4r5s6t7v8w9x0yz
        title:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/CaseStatus"
        priority:
          $ref: "#/components/schemas/Severity"
        assignee:
          type: string
          nullable: true
        resolution:
          allOf:
            - $ref: "#/components/schemas/CaseResolution"
          nullable: true
        resolution_note:
          type: string
          nullable: true
        resolved_at:
          type: string
          format: date-time
          nullable: true
        resolved_by:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
        updated_at:
          type: string
          format: date-time
    CaseList:
      type: object
      additionalProperties: false
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Case"
        next_cursor:
          type: string
          nullable: true
    CaseNote:
      type: object
      additionalProperties: false
      required: [id, body, author, created_at]
      properties:
        id:
          type: string
          example: cnt_01j9x2k7m3q4r5s6t7v8w9x0yz
        body:
          type: string
        author:
          type: string
        created_at:
          type: string
          format: date-time
    CaseDetail:
      type: object
      additionalProperties: false
      required: [case, alerts, notes, activity]
      properties:
        case:
          $ref: "#/components/schemas/Case"
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/Alert"
        notes:
          type: array
          items:
            $ref: "#/components/schemas/CaseNote"
        activity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityEntry"
    CreateCaseRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        priority:
          $ref: "#/components/schemas/Severity"
        assignee:
          type: string
          maxLength: 254
        alert_ids:
          type: array
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            maxLength: 64
    UpdateCaseRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        priority:
          $ref: "#/components/schemas/Severity"
        assignee:
          type: string
          maxLength: 254
        status:
          $ref: "#/components/schemas/CaseStatus"
        resolution:
          $ref: "#/components/schemas/CaseResolution"
        resolution_note:
          type: string
          maxLength: 5000
    CreateCaseNoteRequest:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 10000
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code:
          type: string
          description: Stable, machine-readable error code (UPPER_SNAKE_CASE).
          example: INVALID_REQUEST
        message:
          type: string
          description: Human-readable, safe-to-display description. Never contains internals.
          example: The request is invalid.
        request_id:
          type: string
          example: req_01j9x2k7m3q4r5s6t7v8w9x0yz
    LivenessResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        checks:
          type: object
          description: Status per dependency, keyed by dependency name.
          additionalProperties:
            type: string
            enum: [ok, unavailable]

    Environment:
      type: string
      enum: [test, production]
    Scope:
      type: string
      description: A permission an API key holds.
      enum: [api_keys:read, api_keys:write, audit_logs:read, events:write, events:read, risk:evaluate, rules:read, rules:write, risk:configure, alerts:read, alerts:write, cases:read, cases:write, webhooks:read, webhooks:write]
    Whoami:
      type: object
      additionalProperties: false
      required: [tenant_id, environment_id, environment, api_key_id, scopes]
      properties:
        tenant_id:
          type: string
          example: ten_01j9x2k7m3q4r5s6t7v8w9x0yz
        environment_id:
          type: string
          example: env_01j9x2k7m3q4r5s6t7v8w9x0yz
        environment:
          $ref: "#/components/schemas/Environment"
        api_key_id:
          type: string
          example: key_01j9x2k7m3q4r5s6t7v8w9x0yz
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/Scope"
    ApiKey:
      type: object
      additionalProperties: false
      required: [id, name, prefix, environment, scopes, status, created_at]
      properties:
        id:
          type: string
          example: key_01j9x2k7m3q4r5s6t7v8w9x0yz
        name:
          type: string
        prefix:
          type: string
          description: The non-secret start of the key, for recognizing it (e.g. in logs of the caller's own systems).
          example: rsk_test_a1b2c3d4e5f6
        environment:
          $ref: "#/components/schemas/Environment"
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/Scope"
        status:
          type: string
          enum: [active, expired, revoked]
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
        replaced_by:
          type: string
          nullable: true
          description: The key that replaced this one through rotation.
    ApiKeyWithSecret:
      type: object
      additionalProperties: false
      required: [api_key, secret]
      properties:
        api_key:
          $ref: "#/components/schemas/ApiKey"
        secret:
          type: string
          description: The full API key. Shown only in this response and never retrievable again.
          example: rsk_test_a1b2c3d4e5f6_0123456789abcdefghjkmnpqrstvwxyz
    ApiKeyList:
      type: object
      additionalProperties: false
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ApiKey"
        next_cursor:
          type: string
          nullable: true
    CreateApiKeyRequest:
      type: object
      additionalProperties: false
      required: [name, scopes]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        scopes:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Scope"
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: Optional expiry; must be in the future.
    RotateApiKeyRequest:
      type: object
      additionalProperties: false
      properties:
        overlap_seconds:
          type: integer
          minimum: 0
          maximum: 604800
          default: 86400
          description: How long the old key keeps working after rotation (default 24 hours, maximum 7 days).
    AuditLogEntry:
      type: object
      additionalProperties: false
      required: [id, sequence, occurred_at, actor, action, resource, outcome, request_id, metadata, hash, prev_hash]
      properties:
        id:
          type: string
          example: aud_01j9x2k7m3q4r5s6t7v8w9x0yz
        sequence:
          type: integer
          format: int64
          description: Position in the tenant's hash chain (1-based, gap-free across all environments).
        occurred_at:
          type: string
          format: date-time
        environment:
          allOf:
            - $ref: "#/components/schemas/Environment"
          nullable: true
          description: Null for tenant-level actions.
        actor:
          type: object
          additionalProperties: false
          required: [type, id]
          properties:
            type:
              type: string
              enum: [api_key, system]
            id:
              type: string
        action:
          type: string
          example: api_key.created
        resource:
          type: object
          additionalProperties: false
          required: [type, id]
          properties:
            type:
              type: string
            id:
              type: string
        outcome:
          type: string
          enum: [success, failure, denied]
        request_id:
          type: string
        metadata:
          type: object
          additionalProperties: true
        hash:
          type: string
          description: Hex SHA-256 of this entry chained to prev_hash.
        prev_hash:
          type: string
    AuditLogList:
      type: object
      additionalProperties: false
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AuditLogEntry"
        next_cursor:
          type: string
          nullable: true

    Event:
      description: |
        An event, discriminated by `type`. Each type has its own `data` shape; unknown fields are
        rejected everywhere. Identifiers are the customer's own opaque references: do not send
        names, emails or other personal data as identifiers.
      oneOf:
        - $ref: "#/components/schemas/LoginEvent"
        - $ref: "#/components/schemas/TransactionEvent"
        - $ref: "#/components/schemas/BeneficiaryAddedEvent"
        - $ref: "#/components/schemas/DeviceChangeEvent"
        - $ref: "#/components/schemas/SessionChangeEvent"
        - $ref: "#/components/schemas/ProfileChangeEvent"
      discriminator:
        propertyName: type
        mapping:
          login: "#/components/schemas/LoginEvent"
          transaction: "#/components/schemas/TransactionEvent"
          beneficiary_added: "#/components/schemas/BeneficiaryAddedEvent"
          device_change: "#/components/schemas/DeviceChangeEvent"
          session_change: "#/components/schemas/SessionChangeEvent"
          profile_change: "#/components/schemas/ProfileChangeEvent"
    LoginEvent:
      type: object
      description: A sign-in attempt.
      additionalProperties: false
      required: [event_id, type, occurred_at, actor, data]
      properties:
        event_id:
          $ref: "#/components/schemas/EventKey"
        occurred_at:
          type: string
          format: date-time
        actor:
          $ref: "#/components/schemas/Actor"
        context:
          $ref: "#/components/schemas/EventContext"
        type:
          type: string
          enum: [login]
        data:
          $ref: "#/components/schemas/LoginData"
    TransactionEvent:
      type: object
      description: A money movement.
      additionalProperties: false
      required: [event_id, type, occurred_at, actor, data]
      properties:
        event_id:
          $ref: "#/components/schemas/EventKey"
        occurred_at:
          type: string
          format: date-time
        actor:
          $ref: "#/components/schemas/Actor"
        context:
          $ref: "#/components/schemas/EventContext"
        type:
          type: string
          enum: [transaction]
        data:
          $ref: "#/components/schemas/TransactionData"
    BeneficiaryAddedEvent:
      type: object
      description: A new payee.
      additionalProperties: false
      required: [event_id, type, occurred_at, actor, data]
      properties:
        event_id:
          $ref: "#/components/schemas/EventKey"
        occurred_at:
          type: string
          format: date-time
        actor:
          $ref: "#/components/schemas/Actor"
        context:
          $ref: "#/components/schemas/EventContext"
        type:
          type: string
          enum: [beneficiary_added]
        data:
          $ref: "#/components/schemas/BeneficiaryAddedData"
    DeviceChangeEvent:
      type: object
      description: A user's device changed.
      additionalProperties: false
      required: [event_id, type, occurred_at, actor, data]
      properties:
        event_id:
          $ref: "#/components/schemas/EventKey"
        occurred_at:
          type: string
          format: date-time
        actor:
          $ref: "#/components/schemas/Actor"
        context:
          $ref: "#/components/schemas/EventContext"
        type:
          type: string
          enum: [device_change]
        data:
          $ref: "#/components/schemas/DeviceChangeData"
    SessionChangeEvent:
      type: object
      description: A session was created, refreshed or ended.
      additionalProperties: false
      required: [event_id, type, occurred_at, actor, data]
      properties:
        event_id:
          $ref: "#/components/schemas/EventKey"
        occurred_at:
          type: string
          format: date-time
        actor:
          $ref: "#/components/schemas/Actor"
        context:
          $ref: "#/components/schemas/EventContext"
        type:
          type: string
          enum: [session_change]
        data:
          $ref: "#/components/schemas/SessionChangeData"
    ProfileChangeEvent:
      type: object
      description: Account profile fields changed.
      additionalProperties: false
      required: [event_id, type, occurred_at, actor, data]
      properties:
        event_id:
          $ref: "#/components/schemas/EventKey"
        occurred_at:
          type: string
          format: date-time
        actor:
          $ref: "#/components/schemas/Actor"
        context:
          $ref: "#/components/schemas/EventContext"
        type:
          type: string
          enum: [profile_change]
        data:
          $ref: "#/components/schemas/ProfileChangeData"
    EventType:
      type: string
      enum: [login, transaction, beneficiary_added, device_change, session_change, profile_change]
    EventKey:
      type: string
      description: The customer's unique ID for the event; the idempotency key.
      pattern: "^[A-Za-z0-9._:-]{1,128}$"
      example: txn_2026_000123
    Reference:
      type: string
      description: An opaque customer-side identifier.
      pattern: "^[A-Za-z0-9._:-]{1,128}$"
    Actor:
      type: object
      additionalProperties: false
      required: [user_id]
      properties:
        user_id:
          $ref: "#/components/schemas/Reference"
        account_id:
          $ref: "#/components/schemas/Reference"
        device_id:
          $ref: "#/components/schemas/Reference"
        session_id:
          $ref: "#/components/schemas/Reference"
    EventContext:
      type: object
      additionalProperties: false
      properties:
        ip:
          type: string
          maxLength: 45
          description: IPv4 or IPv6 address of the end user.
        user_agent:
          type: string
          maxLength: 512
        country:
          type: string
          pattern: "^[A-Z]{2}$"
          description: ISO 3166-1 alpha-2.
    LoginData:
      type: object
      additionalProperties: false
      required: [outcome, method]
      properties:
        outcome:
          type: string
          enum: [success, failure]
        method:
          type: string
          enum: [password, passkey, otp, sso, biometric]
    TransactionData:
      type: object
      additionalProperties: false
      required: [transaction_id, amount, currency, direction]
      properties:
        transaction_id:
          $ref: "#/components/schemas/Reference"
        amount:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000000000
          description: Amount in minor units of the currency (e.g. cents).
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: ISO 4217 code.
        direction:
          type: string
          enum: [debit, credit]
        beneficiary_id:
          $ref: "#/components/schemas/Reference"
        channel:
          type: string
          enum: [card, bank_transfer, instant_payment, wallet, other]
    BeneficiaryAddedData:
      type: object
      additionalProperties: false
      required: [beneficiary_id]
      properties:
        beneficiary_id:
          $ref: "#/components/schemas/Reference"
        country:
          type: string
          pattern: "^[A-Z]{2}$"
    DeviceChangeData:
      type: object
      additionalProperties: false
      required: [new_device_id]
      properties:
        new_device_id:
          $ref: "#/components/schemas/Reference"
        previous_device_id:
          $ref: "#/components/schemas/Reference"
    SessionChangeData:
      type: object
      additionalProperties: false
      required: [change]
      properties:
        change:
          type: string
          enum: [created, refreshed, terminated]
    ProfileChangeData:
      type: object
      additionalProperties: false
      required: [fields]
      properties:
        fields:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items:
            type: string
            enum: [email, phone, address, name, password]
    RiskLevel:
      type: string
      enum: [low, medium, high, critical]
    Decision:
      type: string
      enum: [allow, review, step_up, block]
    Signal:
      type: object
      additionalProperties: false
      required: [code, label, weight]
      properties:
        code:
          type: string
          example: new_device
        label:
          type: string
          example: New device
        weight:
          type: integer
          minimum: 0
          maximum: 100
    RiskDecision:
      type: object
      additionalProperties: false
      description: |
        The risk response (spec §7). risk_score is the sum of the listed signal weights, capped at
        100. degraded_signals lists sources that could not be evaluated for this event.
      required: [request_id, event_id, evaluation_id, risk_score, risk_level, decision, engine_version, signals, degraded_signals]
      properties:
        request_id:
          type: string
          description: The request that produced this decision (for replays, the original request).
        event_id:
          type: string
          nullable: true
          description: RiskOS ID of the stored event; null for dry runs.
          example: evt_01j9x2k7m3q4r5s6t7v8w9x0yz
        evaluation_id:
          type: string
          example: evl_01j9x2k7m3q4r5s6t7v8w9x0yz
        risk_score:
          type: integer
          minimum: 0
          maximum: 100
        risk_level:
          $ref: "#/components/schemas/RiskLevel"
        decision:
          $ref: "#/components/schemas/Decision"
        engine_version:
          type: string
          example: risk-engine-1.0.0
        signals:
          type: array
          items:
            $ref: "#/components/schemas/Signal"
        degraded_signals:
          type: array
          items:
            type: string
    EventSummary:
      type: object
      additionalProperties: false
      required: [id, event_key, type, occurred_at, received_at, risk_score, risk_level, decision]
      properties:
        id:
          type: string
        event_key:
          type: string
        type:
          $ref: "#/components/schemas/EventType"
        occurred_at:
          type: string
          format: date-time
        received_at:
          type: string
          format: date-time
        risk_score:
          type: integer
        risk_level:
          $ref: "#/components/schemas/RiskLevel"
        decision:
          $ref: "#/components/schemas/Decision"
    EventList:
      type: object
      additionalProperties: false
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/EventSummary"
        next_cursor:
          type: string
          nullable: true
    EventDetail:
      type: object
      additionalProperties: false
      required: [id, event_key, type, environment, occurred_at, received_at, raw_payload, normalized_payload, evaluation]
      properties:
        id:
          type: string
        event_key:
          type: string
        type:
          $ref: "#/components/schemas/EventType"
        environment:
          $ref: "#/components/schemas/Environment"
        occurred_at:
          type: string
          format: date-time
        received_at:
          type: string
          format: date-time
        raw_payload:
          type: object
          additionalProperties: true
          description: The request body as received.
        normalized_payload:
          type: object
          additionalProperties: true
          description: The canonical form the risk engine evaluated.
        evaluation:
          $ref: "#/components/schemas/RiskDecision"

    RuleCondition:
      type: object
      additionalProperties: true
      description: |
        A condition tree. Each node is exactly one of:
        `{"all": [node, ...]}`, `{"any": [node, ...]}`, `{"not": node}`, or a comparison
        `{"field": "<field>", "op": "<operator>", "value": <value>}`. Fields and their operators
        are listed by `GET /api/v1/risk/catalog`. At most 50 nodes, 6 levels deep, 100 list
        items. A comparison on a field the event does not have never matches.
      example:
        all:
          - field: transaction.amount
            op: gt
            value: 1000000
          - field: feature.new_beneficiary
            op: eq
            value: true
    Severity:
      type: string
      enum: [low, medium, high, critical]
    RuleMode:
      type: string
      enum: [active, shadow]
      description: active rules add their weight to the score; shadow rules are only recorded.
    Rule:
      type: object
      additionalProperties: false
      required: [id, code, name, description, severity, weight, mode, enabled, condition, version, created_at, updated_at]
      properties:
        id:
          type: string
          example: rul_01j9x2k7m3q4r5s6t7v8w9x0yz
        code:
          type: string
          description: Signal code the rule emits when it matches.
          example: high_value_new_beneficiary
        name:
          type: string
        description:
          type: string
        severity:
          $ref: "#/components/schemas/Severity"
        weight:
          type: integer
          minimum: 0
          maximum: 100
        mode:
          $ref: "#/components/schemas/RuleMode"
        enabled:
          type: boolean
        condition:
          $ref: "#/components/schemas/RuleCondition"
        version:
          type: integer
        restored_from:
          type: integer
          nullable: true
          description: Set when this version restored an earlier one.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          description: When the current version was created.
    RuleList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Rule"
    CreateRuleRequest:
      type: object
      additionalProperties: false
      required: [code, name, severity, weight, mode, condition]
      properties:
        code:
          type: string
          pattern: "^[a-z][a-z0-9_]{2,63}$"
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        severity:
          $ref: "#/components/schemas/Severity"
        weight:
          type: integer
          minimum: 0
          maximum: 100
        mode:
          $ref: "#/components/schemas/RuleMode"
        enabled:
          type: boolean
          default: true
        condition:
          $ref: "#/components/schemas/RuleCondition"
    UpdateRuleRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        severity:
          $ref: "#/components/schemas/Severity"
        weight:
          type: integer
          minimum: 0
          maximum: 100
        mode:
          $ref: "#/components/schemas/RuleMode"
        enabled:
          type: boolean
        condition:
          $ref: "#/components/schemas/RuleCondition"
    RuleVersion:
      type: object
      additionalProperties: false
      required: [version, name, description, severity, weight, mode, enabled, condition, created_at, created_by]
      properties:
        version:
          type: integer
        name:
          type: string
        description:
          type: string
        severity:
          $ref: "#/components/schemas/Severity"
        weight:
          type: integer
        mode:
          $ref: "#/components/schemas/RuleMode"
        enabled:
          type: boolean
        condition:
          $ref: "#/components/schemas/RuleCondition"
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
        restored_from:
          type: integer
          nullable: true
    RuleVersionList:
      type: object
      additionalProperties: false
      required: [rule_id, current_version, data]
      properties:
        rule_id:
          type: string
        current_version:
          type: integer
        data:
          type: array
          items:
            $ref: "#/components/schemas/RuleVersion"
    RollbackRuleRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version:
          type: integer
          minimum: 1
    TestRuleRequest:
      type: object
      additionalProperties: false
      required: [event]
      properties:
        event:
          $ref: "#/components/schemas/Event"
        condition:
          $ref: "#/components/schemas/RuleCondition"
    TestRuleResult:
      type: object
      additionalProperties: false
      required: [rule_id, draft, matched, facts]
      properties:
        rule_id:
          type: string
        version:
          type: integer
          nullable: true
          description: The version tested; null when a draft condition was tested.
        draft:
          type: boolean
        matched:
          type: boolean
        facts:
          type: object
          additionalProperties: true
          description: Values of the fields the condition references, for this event.
    RiskSettings:
      type: object
      additionalProperties: false
      required: [weights, high_value_default, high_value_by_currency, fail_policies]
      properties:
        weights:
          type: object
          description: Overrides of built-in signal weights (0-50), keyed by signal code.
          additionalProperties:
            type: integer
            minimum: 0
            maximum: 50
        high_value_default:
          type: integer
          format: int64
          minimum: 1
          description: |
            High-value threshold in minor units for currencies without their own entry. While any
            signal source is degraded, events at or above it get at least REVIEW.
          example: 1000000
        high_value_by_currency:
          type: object
          additionalProperties:
            type: integer
            format: int64
            minimum: 1
          example:
            USD: 500000
        fail_policies:
          type: object
          description: |
            What a degraded evaluation falls back to, per event type: `closed` (at least REVIEW)
            or `open` (allow, flagged). Types not listed fail closed.
          additionalProperties:
            type: string
            enum: [open, closed]
          example:
            transaction: closed
            login: open
        alert_min_decision:
          type: string
          enum: [step_up, review]
          default: review
          description: |
            The least severe decision that raises an alert. Always present in responses; when
            omitted from a PUT, `review` is stored.
    RiskCatalog:
      type: object
      additionalProperties: false
      required: [engine_version, signals, fields]
      properties:
        engine_version:
          type: string
        signals:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, label, default_weight, weight, source, strengthenable]
            properties:
              code:
                type: string
              label:
                type: string
              default_weight:
                type: integer
              weight:
                type: integer
                description: Effective weight in the caller's environment.
              source:
                type: string
                enum: [history, velocity, network]
              strengthenable:
                type: boolean
                description: Whether the signal turns a MEDIUM decision into STEP_UP.
        fields:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, type, operators]
            properties:
              name:
                type: string
              type:
                type: string
                enum: [number, string, boolean]
              operators:
                type: array
                items:
                  type: string

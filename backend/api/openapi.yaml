    ComplianceParameter:
      type: object
      additionalProperties: false
      required: [name, label, type, default, value, min, max]
      properties:
        name:
          type: string
        label:
          type: string
        type:
          type: string
          description: |
            The unit. money is in minor units of `currency`; duration is in seconds; hour is an hour of
            the day in Africa/Lagos time; flag is 0 or 1.
          enum: [money, duration, count, ratio, points, percent, speed, hour, score, flag]
        currency:
          type: string
        default:
          type: number
          format: double
          nullable: true
          description: Null when the institution must set the value.
        value:
          type: number
          format: double
          nullable: true
          description: The value in this environment (configured, else the default); null when unset.
        min:
          type: number
          format: double
        max:
          type: number
          format: double
          description: For regulatory limits, the legal maximum.

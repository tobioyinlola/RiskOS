          $ref: "#/components/schemas/BeneficiaryAddedData"
    DeviceChangeEvent:
      type: object
      description: A user's device changed.
      additionalProperties: false
      required: [event_id, type, occurred_at, actor, data]
      properties:
        event_id:
          $ref: "#/components/schemas/EventKey"
        occurred_at:

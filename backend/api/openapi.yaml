openapi: 3.0.3
info:
  title: RiskOS API
  version: 0.8.0
  description: |
    RiskOS public HTTP contract. This file is the single source of truth: Go server stubs and the
    TypeScript client are generated from it (`make generate`), and CI fails if generated code drifts.

    **Authentication.** Every `/api/v1` operation requires an API key sent as
    `Authorization: Bearer rsk_test_…` (test environment) or `rsk_live_…` (production). The key
    determines the tenant and environment; no request field can change them. A key can only act
    within its own environment and only with the scopes it holds.

    **Errors** use one contract: `{"error":{"code","message","request_id"}}`.

    **Idempotency.** `POST /api/v1/events` is idempotent on the event's `event_id` within the
    key's environment. Retrying with the same payload returns the original response with the
    header `Idempotent-Replay: true`; the same `event_id` with a different payload is rejected with
    `409 IDEMPOTENCY_CONFLICT`.

    **Rate limits.** Requests are limited per API key and per tenant. Excess requests get
    `429 RATE_LIMITED` with `Retry-After` (seconds).

    **Pagination.** List operations return `data` and `next_cursor`. Pass `next_cursor` back as
    `cursor` to get the next page; `next_cursor` is null on the last page. Results are newest first.
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: health
    description: Liveness and readiness probes for orchestrators and load balancers.
  - name: auth
    description: The calling credential and API key management.
  - name: audit
    description: The tenant's tamper-evident audit trail.
  - name: events
    description: Event ingestion with a synchronous risk decision, and the event explorer.
  - name: risk
    description: Risk evaluation without ingestion, the signal catalog and risk settings.
  - name: rules
    description: Customer rules, versioned, testable and reversible.
  - name: alerts
    description: Alerts raised from risk decisions and degraded evaluations, and their triage.
  - name: cases
    description: Investigation cases grouping alerts, with notes and a resolution.
  - name: webhooks
    description: Signed notifications to customer endpoints, with delivery logs and retries.
  - name: session
    description: Console sign-in, second factors and sessions (cookie-based; not for API keys).
  - name: team
    description: Console users and invites.
  - name: onboarding
    description: Compliance onboarding of self-serve workspaces (know your business).
  - name: compliance
    description: |
      The jurisdiction rule pack a workspace is on (ADR-0006): regulatory controls, risk-scoring
      rules and governance presets, each with its legal source, effective date, verification status
      and the library's plain-English wording.
security:
  - apiKey: []
paths:
  /health/live:
    get:
      operationId: getLiveness
      tags: [health]
      summary: Liveness probe
      security: []
      description: Returns 200 while the process is running and able to serve HTTP. Performs no dependency checks.
      responses:
        "200":
          description: Process is alive.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessResponse"
        default:
          $ref: "#/components/responses/DefaultError"
  /health/ready:
    get:
      operationId: getReadiness
      tags: [health]
      summary: Readiness probe
      security: []
      description: |
        Returns 200 when every required dependency (PostgreSQL, Redis) answered within its check
        timeout, and 503 otherwise, including while the server is draining during shutdown.
        Per-dependency status is reported without internal error details.
      responses:
        "200":
          description: Ready to receive traffic.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: Not ready; at least one dependency is unavailable or the server is draining.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/whoami:
    get:
      operationId: getWhoami
      tags: [auth]
      summary: Describe the calling credential
      description: Returns the tenant, environment and scopes the presented API key resolves to. Requires no scope.
      responses:
        "200":
          description: The authenticated credential.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Whoami"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/api-keys:
    get:
      operationId: listAPIKeys
      tags: [auth]
      summary: List API keys of the caller's environment
      description: Requires scope `api_keys:read`. Secrets are never returned.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of API keys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/DefaultError"
    post:
      operationId: createAPIKey
      tags: [auth]
      summary: Create an API key in the caller's environment
      description: |
        Requires scope `api_keys:write`. The new key can only receive scopes the caller holds.
        The secret is returned **once**, in this response; store it immediately.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequest"
      responses:
        "201":
          description: Created. Contains the only copy of the secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyWithSecret"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/api-keys/{key_id}/rotate:
    post:
      operationId: rotateAPIKey
      tags: [auth]
      summary: Rotate an API key
      description: |
        Requires scope `api_keys:write` and every scope of the rotated key. Creates a replacement
        with the same name and scopes and returns its secret once. The old key keeps working for
        the overlap window, then expires. A revoked or already-rotated key cannot be rotated.
      parameters:
        - $ref: "#/components/parameters/KeyId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RotateApiKeyRequest"
      responses:
        "201":
          description: The replacement key. Contains the only copy of its secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyWithSecret"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/api-keys/{key_id}/revoke:
    post:
      operationId: revokeAPIKey
      tags: [auth]
      summary: Revoke an API key
      description: |
        Requires scope `api_keys:write`. Takes effect within seconds on every instance. Revoking an
        already revoked key returns it unchanged.
      parameters:
        - $ref: "#/components/parameters/KeyId"
      responses:
        "200":
          description: The revoked key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKey"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/audit-logs:
    get:
      operationId: listAuditLogs
      tags: [audit]
      summary: List audit entries
      description: |
        Requires scope `audit_logs:read`. Returns tenant-level entries and entries of the caller's
        environment. Each entry carries its position in the tenant's hash chain.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of audit entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/events:
    post:
      operationId: ingestEvent
      tags: [events]
      summary: Ingest an event and get its risk decision
      description: |
        Requires scope `events:write`. Validates, normalizes and stores the event, evaluates it
        and returns the decision in the same response. Idempotent on `event_id` (see above).
        Timestamps must be at most 5 minutes in the future and 24 hours in the past.
        Card numbers, CVVs, PINs and passwords must never be sent; payloads containing
        card-number-like values are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Event"
      responses:
        "200":
          description: "The risk decision. Replays carry `Idempotent-Replay: true`."
          headers:
            Idempotent-Replay:
              schema:
                type: string
                enum: ["true"]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskDecision"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"
    get:
      operationId: listEvents
      tags: [events]
      summary: List events of the caller's environment
      description: |
        Requires scope `events:read`. Newest first. Every filter is optional. `after` returns
        only events newer than the given event (the live monitor polls with it).
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: after
          in: query
          required: false
          description: Only events newer than this event ID.
          schema:
            type: string
            maxLength: 64
        - name: type
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/EventType"
        - name: decision
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Decision"
        - name: risk_level
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/RiskLevel"
        - name: user
          in: query
          required: false
          description: Only events of this user (actor.user_id).
          schema:
            type: string
            maxLength: 128
        - name: account
          in: query
          required: false
          description: Only events of this account (actor.account_id).
          schema:
            type: string
            maxLength: 128
        - name: device
          in: query
          required: false
          description: Only events from this device (actor.device_id).
          schema:
            type: string
            maxLength: 128
      responses:
        "200":
          description: A page of events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/entities/{kind}/{ref}:
    get:
      operationId: getEntityProfile
      tags: [events]
      summary: A user's, account's or device's profile
      description: |
        Requires scope `events:read`. Built from the entity's most recent 5,000 events: activity,
        scores, decisions, and the users, accounts, devices, countries and IP addresses seen with
        it. 404 when the environment has no events for it.
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum: [user, account, device]
        - name: ref
          in: path
          required: true
          description: The identifier you send as actor.user_id, account_id or device_id.
          schema:
            type: string
            maxLength: 128
      responses:
        "200":
          description: The profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityProfile"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/analytics:
    get:
      operationId: getAnalytics
      tags: [events]
      summary: Decisions, scores and signals over time
      description: |
        Requires scope `events:read`. Events per bucket (hourly for 24h and 7d, daily for 30d),
        the highest-risk users and the signals that fired most, over the window.
      parameters:
        - name: window
          in: query
          required: false
          schema:
            type: string
            enum: [24h, 7d, 30d]
            default: 24h
      responses:
        "200":
          description: The analytics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analytics"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/events/{event_id}:
    get:
      operationId: getEvent
      tags: [events]
      summary: Get an event with its payloads and evaluation
      description: Requires scope `events:read`.
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
            example: evt_01j9x2k7m3q4r5s6t7v8w9x0yz
      responses:
        "200":
          description: The event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/risk/evaluate:
    post:
      operationId: evaluateRisk
      tags: [risk]
      summary: Evaluate an event without ingesting it (dry run)
      description: |
        Requires scope `risk:evaluate`. Runs the same validation and evaluation as ingestion but
        stores no event; the evaluation is recorded as a dry run and never raises alerts or
        webhooks. Not idempotent: every call is evaluated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Event"
      responses:
        "200":
          description: The risk decision (event_id is null).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskDecision"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/risk/catalog:
    get:
      operationId: getRiskCatalog
      tags: [risk]
      summary: Built-in signals and the fields rules can use
      description: Requires scope `rules:read`. Includes each signal's default and effective weight for the caller's environment.
      responses:
        "200":
          description: The catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskCatalog"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/risk/policy:
    get:
      operationId: getRiskPolicy
      tags: [risk]
      summary: The environment's risk bands, thresholds and default decisions
      description: |
        Readable with any of `events:read`, `alerts:read`, `cases:read`, `rules:read`,
        `risk:evaluate` or `risk:configure`: everyone who sees scores can see how they are banded.
      responses:
        "200":
          description: The policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskPolicy"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/v1/risk/settings:
    get:
      operationId: getRiskSettings
      tags: [risk]
      summary: Get the environment's risk settings
      description: Requires scope `risk:configure`. Returns product defaults until settings are saved.
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskSettings"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"
    put:
      operationId: putRiskSettings
      tags: [risk]
      summary: Replace the environment's risk settings
      description: |
        Requires scope `risk:configure`. Audited. Built-in signal weights may be tuned between 0
        and 50; changes apply within seconds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RiskSettings"
      responses:
        "200":
          description: The stored settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskSettings"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/rules:
    get:
      operationId: listRules
      tags: [rules]
      summary: List rules with their current versions
      description: Requires scope `rules:read`.
      responses:
        "200":
          description: The rules, by code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"
    post:
      operationId: createRule
      tags: [rules]
      summary: Create a rule
      description: |
        Requires scope `rules:write`. Audited. Start new rules in `shadow` mode: they are evaluated
        on live traffic and recorded, but do not change decisions until switched to `active`.
        Returns 409 when the code is taken or the environment already has 200 rules (disabled
        rules count; rules are disabled, never deleted).
        In a production environment the change is proposed instead (202) and applies only when
        another person approves it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRuleRequest"
      responses:
        "201":
          description: The created rule (version 1). Test environments apply changes at once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"
        "202":
          description: |
            Production environments: the change was proposed and awaits approval by another person
            (two-person rule). Nothing has changed yet; approve it with
            `POST /api/v1/rule-changes/{change_id}/approve`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleChange"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/rules/{rule_id}:
    get:
      operationId: getRule
      tags: [rules]
      summary: Get a rule
      description: Requires scope `rules:read`.
      parameters:
        - name: rule_id
          in: path
          required: true
          schema:
            type: string
            example: rul_01j9x2k7m3q4r5s6t7v8w9x0yz
      responses:
        "200":
          description: The rule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"
    patch:
      operationId: updateRule
      tags: [rules]
      summary: Change a rule (creates a new version)
      description: |
        Requires scope `rules:write`. Audited. Only the given fields change. Every change creates a
        new version; earlier versions are kept and can be restored. A change that alters nothing
        creates no version.
        In a production environment the change is proposed instead (202) and applies only when
        another person approves it.
      parameters:
        - name: rule_id
          in: path
          required: true
          schema:
            type: string
            example: rul_01j9x2k7m3q4r5s6t7v8w9x0yz
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRuleRequest"
      responses:
        "200":
          description: The rule with its (possibly new) current version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"
        "202":
          description: |
            Production environments: the change was proposed and awaits approval by another person
            (two-person rule). Nothing has changed yet; approve it with
            `POST /api/v1/rule-changes/{change_id}/approve`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleChange"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/rules/{rule_id}/versions:
    get:
      operationId: listRuleVersions
      tags: [rules]
      summary: A rule's version history
      description: Requires scope `rules:read`. Newest first.
      parameters:
        - name: rule_id
          in: path
          required: true
          schema:
            type: string
            example: rul_01j9x2k7m3q4r5s6t7v8w9x0yz
      responses:
        "200":
          description: The versions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleVersionList"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/rules/{rule_id}/rollback:
    post:
      operationId: rollbackRule
      tags: [rules]
      summary: Restore an earlier version (one-step rollback)
      description: |
        Requires scope `rules:write`. Audited. Adds a new version with the content of the given
        version; history is never rewritten.
        In a production environment the change is proposed instead (202) and applies only when
        another person approves it.
      parameters:
        - name: rule_id
          in: path
          required: true
          schema:
            type: string
            example: rul_01j9x2k7m3q4r5s6t7v8w9x0yz
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RollbackRuleRequest"
      responses:
        "200":
          description: The rule with the restored content as its new current version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"
        "202":
          description: |
            Production environments: the change was proposed and awaits approval by another person
            (two-person rule). Nothing has changed yet; approve it with
            `POST /api/v1/rule-changes/{change_id}/approve`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleChange"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/rules/{rule_id}/test:
    post:
      operationId: testRule
      tags: [rules]
      summary: Test a rule against an event
      description: |
        Requires scope `rules:read`. Evaluates the rule's current condition, or a draft
        `condition`, against the event using the environment's live features without changing
        them. Nothing is stored. Returns whether it matched and the values of the fields the
        condition uses.
      parameters:
        - name: rule_id
          in: path
          required: true
          schema:
            type: string
            example: rul_01j9x2k7m3q4r5s6t7v8w9x0yz
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestRuleRequest"
      responses:
        "200":
          description: The test result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestRuleResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/deny-list:
    get:
      operationId: listDenyEntries
      tags: [rules]
      summary: List the deny list
      description: |
        Requires `rules:read` or `risk:configure`. Newest first, at most 1,000. Events whose user,
        account, device, IP address, beneficiary or country is listed (and not expired) are
        blocked, whatever their score.
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/DenyKind"
      responses:
        "200":
          description: The entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DenyEntryList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"
    post:
      operationId: createDenyEntry
      tags: [rules]
      summary: Add an identifier to the deny list
      description: |
        Requires `risk:configure`. Audited. Takes effect within seconds. IP addresses are stored
        in canonical form and countries upper-case; other identifiers must match exactly what you
        send in events. 409 when the identifier is already listed or the environment has 10,000
        entries.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDenyEntryRequest"
      responses:
        "201":
          description: The entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DenyEntry"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/deny-list/{entry_id}:
    delete:
      operationId: deleteDenyEntry
      tags: [rules]
      summary: Remove an identifier from the deny list
      description: Requires `risk:configure`. Audited. Takes effect within seconds.
      parameters:
        - name: entry_id
          in: path
          required: true
          schema:
            type: string
            example: dny_01j9x2k7m3q4r5s6t7v8w9x0yz
      responses:
        "204":
          description: Removed.
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/rule-changes:
    get:
      operationId: listRuleChanges
      tags: [rules]
      summary: List proposed rule changes
      description: Requires scope `rules:read`. Newest first, at most 200.
      parameters:
        - name: status
          in: query
          required: false
          description: Only changes in this state (default pending).
          schema:
            type: string
            enum: [pending, approved, rejected, all]
            default: pending
      responses:
        "200":
          description: The changes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleChangeList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/rule-changes/{change_id}:
    get:
      operationId: getRuleChange
      tags: [rules]
      summary: Get a proposed rule change
      description: Requires scope `rules:read`.
      parameters:
        - name: change_id
          in: path
          required: true
          schema:
            type: string
            example: rch_01j9x2k7m3q4r5s6t7v8w9x0yz
      responses:
        "200":
          description: The change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleChange"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/rule-changes/{change_id}/approve:
    post:
      operationId: approveRuleChange
      tags: [rules]
      summary: Approve a proposed rule change (applies it)
      description: |
        Requires the `rules:approve` permission, which only people hold (never API keys), and a
        recent second factor in the console. The approver must not be the person who proposed
        the change. Applies the change as the rule's next version; returns 409 if the rule has
        changed since the proposal (propose again) or the change is already decided. Audited.
      parameters:
        - name: change_id
          in: path
          required: true
          schema:
            type: string
            example: rch_01j9x2k7m3q4r5s6t7v8w9x0yz
      responses:
        "200":
          description: The approved change, with the version it created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleChange"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/rule-changes/{change_id}/reject:
    post:
      operationId: rejectRuleChange
      tags: [rules]
      summary: Reject or withdraw a proposed rule change
      description: |
        Requires `rules:approve`, or `rules:write` for the person or key that proposed the change
        (withdrawing it). Nothing changes on the rule. Audited.
      parameters:
        - name: change_id
          in: path
          required: true
          schema:
            type: string
            example: rch_01j9x2k7m3q4r5s6t7v8w9x0yz
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectRuleChangeRequest"
      responses:
        "200":
          description: The rejected change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleChange"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/alerts:
    get:
      operationId: listAlerts
      tags: [alerts]
      summary: List alerts, newest first
      description: Requires scope `alerts:read`.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AlertStatus"
        - name: kind
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AlertKind"
      responses:
        "200":
          description: A page of alerts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/alerts/{alert_id}:
    get:
      operationId: getAlert
      tags: [alerts]
      summary: Get an alert with its evaluations and timeline
      description: Requires scope `alerts:read`. Returns the newest 100 evaluations the alert groups.
      parameters:
        - name: alert_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
            example: alr_01j9x2k7m3q4r5s6t7v8w9x0yz
      responses:
        "200":
          description: The alert.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"
    patch:
      operationId: updateAlert
      tags: [alerts]
      summary: Triage an alert (status, assignee, note)
      description: |
        Requires scope `alerts:write`. Audited. Allowed status changes: `open` and `investigating`
        to any of `open`, `investigating`, `false_positive`, `resolved`. `false_positive` and
        `resolved` are final. Alerts are escalated by creating a case with them
        (`POST /api/v1/cases`); an escalated alert is closed by resolving its case. An empty
        `assignee` unassigns. A change that alters nothing is a no-op.
      parameters:
        - name: alert_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
            example: alr_01j9x2k7m3q4r5s6t7v8w9x0yz
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAlertRequest"
      responses:
        "200":
          description: The alert.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/cases:
    get:
      operationId: listCases
      tags: [cases]
      summary: List cases, newest first
      description: Requires scope `cases:read`.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/CaseStatus"
      responses:
        "200":
          description: A page of cases.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"
    post:
      operationId: createCase
      tags: [cases]
      summary: Open a case, optionally escalating alerts into it
      description: |
        Requires scope `cases:write`, and `alerts:write` when `alert_ids` are given. Audited. Every
        listed alert must be `open` or `investigating`; they become `escalated`. Without a
        `priority`, the case takes the highest severity of its alerts (`medium` without alerts).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCaseRequest"
      responses:
        "201":
          description: The case.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/cases/{case_id}:
    get:
      operationId: getCase
      tags: [cases]
      summary: Get a case with its alerts, notes and timeline
      description: Requires scope `cases:read`.
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
            example: cas_01j9x2k7m3q4r5s6t7v8w9x0yz
      responses:
        "200":
          description: The case.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"
    patch:
      operationId: updateCase
      tags: [cases]
      summary: Update or resolve a case
      description: |
        Requires scope `cases:write`. Audited. Resolving (`status: resolved`) requires a
        `resolution` and closes the case's alerts: `false_positive` when the resolution is
        `false_positive`, otherwise `resolved`. A resolved case is final; notes can still be added.
        An empty `assignee` unassigns.
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
            example: cas_01j9x2k7m3q4r5s6t7v8w9x0yz
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCaseRequest"
      responses:
        "200":
          description: The case.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/cases/{case_id}/notes:
    post:
      operationId: addCaseNote
      tags: [cases]
      summary: Add a note to a case
      description: |
        Requires scope `cases:write`. Notes are append-only: they cannot be edited or deleted. Do
        not put card numbers, passwords or other secrets in notes.
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
            example: cas_01j9x2k7m3q4r5s6t7v8w9x0yz
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCaseNoteRequest"
      responses:
        "201":
          description: The note.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseNote"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/webhooks:
    get:
      operationId: listWebhooks
      tags: [webhooks]
      summary: List webhook endpoints
      description: |
        Requires scope `webhooks:read`.
      responses:
        "200":
          description: The environment's endpoints, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"
    post:
      operationId: createWebhook
      tags: [webhooks]
      summary: Register a webhook endpoint
      description: |
        Requires scope `webhooks:write`. Audited. The response contains the endpoint's signing secret,
        shown only this once. URLs must use https and must not point to localhost or private,
        loopback, link-local or reserved addresses (also checked after DNS resolution on every
        delivery). At most 20 endpoints per environment (409 beyond).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWebhookRequest"
      responses:
        "201":
          description: The endpoint and its secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookWithSecret"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/webhooks/{webhook_id}:
    get:
      operationId: getWebhook
      tags: [webhooks]
      summary: Get a webhook endpoint
      description: |
        Requires scope `webhooks:read`. Never returns the secret.
      parameters:
        - name: webhook_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
            example: whk_01j9x2k7m3q4r5s6t7v8w9x0yz
      responses:
        "200":
          description: The endpoint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Webhook"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"
    patch:
      operationId: updateWebhook
      tags: [webhooks]
      summary: Change or enable/disable a webhook endpoint
      description: |
        Requires scope `webhooks:write`. Audited. Setting `status: active` re-enables an endpoint
        disabled after failing, and clears its failure state.
      parameters:
        - name: webhook_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
            example: whk_01j9x2k7m3q4r5s6t7v8w9x0yz
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWebhookRequest"
      responses:
        "200":
          description: The endpoint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Webhook"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/webhooks/{webhook_id}/rotate-secret:
    post:
      operationId: rotateWebhookSecret
      tags: [webhooks]
      summary: Rotate a webhook endpoint's signing secret
      description: |
        Requires scope `webhooks:write`. Audited. Returns the new secret, shown only this once.
        Until the overlap ends, deliveries carry signatures from both the new and the previous
        secret, so receivers can switch without dropping events.
      parameters:
        - name: webhook_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
            example: whk_01j9x2k7m3q4r5s6t7v8w9x0yz
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RotateWebhookSecretRequest"
      responses:
        "200":
          description: The endpoint and its new secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookWithSecret"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/webhooks/{webhook_id}/test:
    post:
      operationId: testWebhook
      tags: [webhooks]
      summary: Send a test event to an endpoint
      description: |
        Requires scope `webhooks:write`. Queues a `webhook.test` event for this endpoint only.
      parameters:
        - name: webhook_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
            example: whk_01j9x2k7m3q4r5s6t7v8w9x0yz
      responses:
        "202":
          description: The queued delivery.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDelivery"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/webhooks/{webhook_id}/deliveries:
    get:
      operationId: listWebhookDeliveries
      tags: [webhooks]
      summary: List an endpoint's deliveries, newest first
      description: |
        Requires scope `webhooks:read`.
      parameters:
        - name: webhook_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
            example: whk_01j9x2k7m3q4r5s6t7v8w9x0yz
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/WebhookDeliveryStatus"
      responses:
        "200":
          description: A page of deliveries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDeliveryList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/webhooks/{webhook_id}/deliveries/{delivery_id}:
    get:
      operationId: getWebhookDelivery
      tags: [webhooks]
      summary: Get a delivery with its payload and every attempt
      description: |
        Requires scope `webhooks:read`.
      parameters:
        - name: webhook_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
            example: whk_01j9x2k7m3q4r5s6t7v8w9x0yz
        - name: delivery_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
            example: whd_01j9x2k7m3q4r5s6t7v8w9x0yz
      responses:
        "200":
          description: The delivery.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDeliveryDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/webhooks/{webhook_id}/deliveries/{delivery_id}/redeliver:
    post:
      operationId: redeliverWebhook
      tags: [webhooks]
      summary: Retry a failed delivery
      description: |
        Requires scope `webhooks:write`. Audited. Starts a new delivery cycle for a `failed` delivery
        to an active endpoint. The event keeps its ID.
      parameters:
        - name: webhook_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
            example: whk_01j9x2k7m3q4r5s6t7v8w9x0yz
        - name: delivery_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
            example: whd_01j9x2k7m3q4r5s6t7v8w9x0yz
      responses:
        "202":
          description: The delivery, pending again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDelivery"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/auth/login:
    post:
      operationId: login
      tags: [session]
      summary: Sign in to the console with email and password
      security: []
      description: |
        Starts a console session. The response says which second factor is needed next
        (`mfa_required`) or that the user must enroll one (`enrollment_required`); the cookie is set
        either way. Wrong email, wrong password and disabled accounts get the same 401. Attempts are
        throttled per email and per IP (429). Not for API keys.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: The session's next step.
          headers:
            Set-Cookie:
              description: The session cookie (HttpOnly, SameSite=Strict, Secure outside local development).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthState"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/v1/auth/session:
    get:
      operationId: getSession
      tags: [session]
      summary: The current console session
      security: []
      description: |
        Returns the signed-in user, tenant, role, permissions, second factors, the session's state
        and the CSRF token the console must send in `X-CSRF-Token` on every unsafe request.
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleSession"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [session]
      summary: Sign out
      security: []
      description: |
        Ends the session and clears the cookie.
      responses:
        "204":
          description: Signed out.
          headers:
            Set-Cookie:
              description: The session cookie (HttpOnly, SameSite=Strict, Secure outside local development).
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/v1/auth/mfa/totp/verify:
    post:
      operationId: verifyTotp
      tags: [session]
      summary: Verify an authenticator-app code
      security: []
      description: |
        Completes sign-in (`mfa_required`) or re-authenticates an active session for high-impact
        actions. Each code works once. Throttled per user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeRequest"
      responses:
        "200":
          description: The session's state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthState"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/v1/auth/mfa/recovery/verify:
    post:
      operationId: verifyRecoveryCode
      tags: [session]
      summary: Use a recovery code
      security: []
      description: |
        Like `verifyTotp` with one of the single-use recovery codes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeRequest"
      responses:
        "200":
          description: The session's state and the codes left.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthState"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/v1/auth/mfa/totp/enroll:
    post:
      operationId: enrollTotp
      tags: [session]
      summary: Start authenticator-app enrollment
      security: []
      description: |
        For a new user (`enrollment_required`), or an active session re-authenticated within the
        last 10 minutes. Returns the secret and an `otpauth://` URI for a QR code.
      responses:
        "200":
          description: The pending enrollment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpEnrollment"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/v1/auth/mfa/totp/confirm:
    post:
      operationId: confirmTotp
      tags: [session]
      summary: Confirm authenticator-app enrollment
      security: []
      description: |
        Confirms enrollment with a first code. Returns recovery codes, shown once, if the user had
        none. A new user's session becomes active.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeRequest"
      responses:
        "200":
          description: The session's state (with recovery codes when issued).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthState"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/v1/auth/mfa/passkeys/register/options:
    post:
      operationId: passkeyRegistrationOptions
      tags: [session]
      summary: Start adding a passkey
      security: []
      description: |
        Returns WebAuthn `PublicKeyCredentialCreationOptions` for `navigator.credentials.create`. Same conditions as `enrollTotp`.
      responses:
        "200":
          description: WebAuthn creation options.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnOptions"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/v1/auth/mfa/passkeys/register:
    post:
      operationId: registerPasskey
      tags: [session]
      summary: Finish adding a passkey
      security: []
      description: |
        Verifies the authenticator's response and stores the passkey. Returns recovery codes, shown once, if the user had none.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyRegistrationRequest"
      responses:
        "200":
          description: The session's state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthState"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/v1/auth/mfa/passkeys/login/options:
    post:
      operationId: passkeyLoginOptions
      tags: [session]
      summary: Start a passkey verification
      security: []
      description: |
        Returns WebAuthn `PublicKeyCredentialRequestOptions` for `navigator.credentials.get`, to complete sign-in or re-authenticate.
      responses:
        "200":
          description: WebAuthn request options.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnOptions"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/v1/auth/mfa/passkeys/login:
    post:
      operationId: verifyPasskey
      tags: [session]
      summary: Finish a passkey verification
      security: []
      description: |
        Verifies the assertion. Completes sign-in or re-authenticates.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyAssertionRequest"
      responses:
        "200":
          description: The session's state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthState"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/v1/auth/mfa/passkeys/{passkey_id}:
    delete:
      operationId: deletePasskey
      tags: [session]
      summary: Remove a passkey
      security: []
      description: |
        Requires re-authentication within the last 10 minutes. At least one second factor must remain.
      parameters:
        - name: passkey_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 128
            example: pky_AAECAwQ
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/v1/auth/mfa/recovery-codes:
    post:
      operationId: regenerateRecoveryCodes
      tags: [session]
      summary: Replace your recovery codes
      security: []
      description: |
        Requires re-authentication within the last 10 minutes. The new codes are shown once; the old ones stop working.
      responses:
        "200":
          description: The new codes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodes"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/v1/auth/invites/accept:
    post:
      operationId: acceptInvite
      tags: [session]
      summary: Accept an invite
      security: []
      description: |
        Creates the invited user with a name and password and starts a session that must enroll a
        second factor next. Invites are single-use and expire after 72 hours.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInviteRequest"
      responses:
        "200":
          description: The new session's state.
          headers:
            Set-Cookie:
              description: The session cookie (HttpOnly, SameSite=Strict, Secure outside local development).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthState"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/v1/team/members:
    get:
      operationId: listTeamMembers
      tags: [team]
      summary: List the tenant's console users
      description: |
        Requires `team:read`.
      responses:
        "200":
          description: The users.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMemberList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/v1/team/members/{user_id}:
    patch:
      operationId: updateTeamMember
      tags: [team]
      summary: Change a user's role or status
      description: |
        Requires `team:write` and, from the console, re-authentication within the last 10 minutes.
        Audited. You cannot change yourself; the tenant always keeps an active administrator. Any
        change ends the user's sessions.
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 128
            example: usr_01j9x2k7m3q4r5s6t7v8w9x0yz
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTeamMemberRequest"
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/v1/team/invites:
    get:
      operationId: listInvites
      tags: [team]
      summary: List invites
      description: |
        Requires `team:read`.
      responses:
        "200":
          description: Invites, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"
    post:
      operationId: createInvite
      tags: [team]
      summary: Invite a person
      description: |
        Requires `team:write` and, from the console, re-authentication within the last 10 minutes.
        Audited. Returns a single-use link, valid for 72 hours and shown once. When RiskOS has email
        configured, the link is also emailed to the person (`email_queued`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInviteRequest"
      responses:
        "201":
          description: The invite and its link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedInvite"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/v1/team/invites/{invite_id}/revoke:
    post:
      operationId: revokeInvite
      tags: [team]
      summary: Revoke a pending invite
      description: |
        Requires `team:write`. Audited.
      parameters:
        - name: invite_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 128
            example: inv_01j9x2k7m3q4r5s6t7v8w9x0yz
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/v1/auth/sso/start:
    post:
      operationId: startSSO
      tags: [session]
      summary: Start signing in with the tenant's identity provider
      security: []
      description: |
        For a person whose tenant uses single sign-on (OpenID Connect). Returns the provider's
        authorization URL to send the browser to, and sets a short-lived cookie binding the request to
        this browser. Unknown emails, disabled accounts and tenants without SSO all get 404
        `SSO_NOT_CONFIGURED`. Throttled per email and per IP (429). SSO signs in existing accounts only,
        and RiskOS still asks for its own second factor afterwards.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SSOStartRequest"
      responses:
        "200":
          description: Where to send the browser.
          headers:
            Set-Cookie:
              description: The request's browser binding (HttpOnly, SameSite=Lax, ten minutes).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SSOStart"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/v1/auth/sso/callback:
    post:
      operationId: finishSSO
      tags: [session]
      summary: Finish signing in with the tenant's identity provider
      security: []
      description: |
        Called by the console's callback page with the provider's `code` and `state`. The request must
        have been started in this browser within ten minutes, and the provider's ID token must verify.
        The first SSO sign-in also needs the provider to confirm the account's email
        (`email_verified`); it binds the provider's subject to the account, and later sign-ins must
        present the same subject. Starts a console session exactly like `login`: the response says
        which second factor is needed next. Failures get 401 `SSO_FAILED`.
      parameters:
        - name: riskos_sso
          in: cookie
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SSOCallbackRequest"
      responses:
        "200":
          description: The session's next step.
          headers:
            Set-Cookie:
              description: The session cookie (HttpOnly, SameSite=Strict, Secure outside local development).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthState"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/v1/auth/signup/options:
    get:
      operationId: getSignupOptions
      tags: [session]
      summary: Which ways to sign up are available
      security: []
      description: |
        `email` is false when sign-up is switched off or RiskOS cannot send email; `google` is true
        when Google sign-in is configured. The console shows only what is available.
      responses:
        "200":
          description: The available ways to sign up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupOptions"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/v1/auth/signup:
    post:
      operationId: startSignup
      tags: [session]
      summary: Start creating a workspace with email and password
      security: []
      description: |
        Records the sign-up and emails a 6-digit code to prove the address; nothing is created until
        the code is verified. The response is the same whether or not the email already has an
        account (that person gets an email saying so instead of a code). Passwords follow the console
        rules (12 to 128 characters, not the email, not in known breaches). Sets a cookie, valid for an
        hour, that ties the sign-up to this browser. Throttled per email and per IP (429).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "202":
          description: A code is on its way.
          headers:
            Set-Cookie:
              description: The sign-up's browser binding (HttpOnly, SameSite=Lax, one hour).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupPending"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/v1/auth/signup/resend:
    post:
      operationId: resendSignupCode
      tags: [session]
      summary: Send a new code
      security: []
      description: |
        Sends a new code (the previous one stops working), at most once a minute and five times per
        sign-up (429 with Retry-After).
      parameters:
        - name: riskos_signup
          in: cookie
          required: false
          schema:
            type: string
      responses:
        "200":
          description: A new code is on its way.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupPending"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/v1/auth/signup/verify:
    post:
      operationId: verifySignup
      tags: [session]
      summary: Verify the emailed code and create the workspace
      security: []
      description: |
        With the right code, creates the workspace (a tenant with test and production environments,
        production locked until onboarding is approved) and its first administrator, and starts a
        session that must enroll a second factor next. A wrong code gets 400 `CODE_INVALID`; five
        wrong codes end the sign-up (start again).
      parameters:
        - name: riskos_signup
          in: cookie
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupVerifyRequest"
      responses:
        "200":
          description: The new session's state.
          headers:
            Set-Cookie:
              description: The session cookie (HttpOnly, SameSite=Strict, Secure outside local development).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthState"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/v1/auth/signup/complete:
    post:
      operationId: completeSignup
      tags: [session]
      summary: Name the workspace and create it (Google sign-ups)
      security: []
      description: |
        For a sign-up whose email Google verified: creates the workspace with this business name and
        its first administrator, and starts a session that must enroll a second factor next.
      parameters:
        - name: riskos_signup
          in: cookie
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupCompleteRequest"
      responses:
        "200":
          description: The new session's state.
          headers:
            Set-Cookie:
              description: The session cookie (HttpOnly, SameSite=Strict, Secure outside local development).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthState"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/v1/auth/google/start:
    post:
      operationId: startGoogle
      tags: [session]
      summary: Start signing in or up with Google
      security: []
      description: |
        Returns Google's authorization URL and sets a short-lived cookie binding the request to this
        browser. 404 `GOOGLE_NOT_CONFIGURED` when Google sign-in is not set up.
      responses:
        "200":
          description: Where to send the browser.
          headers:
            Set-Cookie:
              description: The request's browser binding (HttpOnly, SameSite=Lax, ten minutes).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SSOStart"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/v1/auth/google/callback:
    post:
      operationId: finishGoogle
      tags: [session]
      summary: Finish signing in or up with Google
      security: []
      description: |
        Called by the console's Google callback page with Google's `code` and `state`. Google must
        confirm the email (`email_verified`). If the email has an account, its first Google sign-in
        binds Google's subject (later ones must match) and a session starts that still needs RiskOS's
        second factor (`outcome: signed_in`). Otherwise a sign-up starts with the verified email
        (`outcome: needs_business`): name the workspace with `completeSignup`. Failures get 401
        `GOOGLE_FAILED`.
      parameters:
        - name: riskos_google
          in: cookie
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SSOCallbackRequest"
      responses:
        "200":
          description: Signed in, or a sign-up waiting for its business name.
          headers:
            Set-Cookie:
              description: The session cookie, or the sign-up's browser binding.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/v1/onboarding:
    get:
      operationId: getOnboarding
      tags: [onboarding]
      summary: The workspace's compliance onboarding
      description: |
        Requires `team:read`. 404 for workspaces created by RiskOS operators (they have no onboarding).
        `missing` lists the answers still needed before submitting.
      responses:
        "200":
          description: The onboarding.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Onboarding"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
    put:
      operationId: saveOnboarding
      tags: [onboarding]
      summary: Save onboarding answers (a draft)
      description: |
        Requires `team:write`. Replaces the answers; allowed while the onboarding is a draft or was
        rejected (saving a rejected one makes it a draft again). 409 once submitted or approved.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingAnswers"
      responses:
        "200":
          description: The onboarding.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Onboarding"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/v1/onboarding/submit:
    post:
      operationId: submitOnboarding
      tags: [onboarding]
      summary: Submit the onboarding for review
      description: |
        Requires `team:write`. Every required answer must be present (400 lists what is missing).
        RiskOS staff then review it; approval opens the production environment.
      responses:
        "200":
          description: The submitted onboarding.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Onboarding"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/v1/compliance/pack:
    get:
      operationId: getCompliancePack
      tags: [compliance]
      summary: The workspace's rule pack
      description: |
        Requires `compliance:read`. The pack version on the workspace's compliance profile, or the most
        recently loaded pack when no profile is set.
      responses:
        "200":
          description: The workspace's rule pack.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompliancePack"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/v1/compliance/rules:
    get:
      operationId: listComplianceRules
      tags: [compliance]
      summary: The pack's rules
      description: |
        Requires `compliance:read`. Every rule of the pack, ordered by ID, with its wording, source,
        effective date, verification status, defaults and bounded parameters. The engineering logic
        is only on a single rule, for callers with `compliance:engineering`.
      parameters:
        - name: group
          in: query
          required: false
          description: Only rules in this group.
          schema:
            type: string
            maxLength: 64
        - name: kind
          in: query
          required: false
          description: Only rules of this kind.
          schema:
            $ref: "#/components/schemas/ComplianceRuleKind"
        - name: regulator
          in: query
          required: false
          description: Only rules involving this regulator (CBN, NFIU and so on).
          schema:
            type: string
            maxLength: 16
        - name: verification
          in: query
          required: false
          description: Only rules with this verification status.
          schema:
            $ref: "#/components/schemas/ComplianceVerification"
        - name: q
          in: query
          required: false
          description: Words to find in a rule's ID, name or description.
          schema:
            type: string
            maxLength: 100
        - name: applicable
          in: query
          required: false
          description: Only rules that do (true) or do not (false) apply to the workspace's licence type and capabilities. Needs a compliance profile.
          schema:
            type: boolean
      responses:
        "200":
          description: The pack's rules.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceRuleList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/v1/compliance/rules/{rule_id}:
    get:
      operationId: getComplianceRule
      tags: [compliance]
      summary: One rule
      description: |
        Requires `compliance:read`. `engineering_logic` (the library's section 7B) and `definition` (the
        machine definition) are included only for callers with `compliance:engineering`.
      parameters:
        - name: rule_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Z]{3}-[0-9]{2}$"
      responses:
        "200":
          description: One rule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceRule"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/v1/compliance/rules/{rule_id}/config:
    get:
      operationId: getPackRuleConfig
      tags: [compliance]
      summary: A rule's configuration in this environment
      description: Requires `compliance:read`. Version 0 means the library's defaults.
      parameters:
        - name: rule_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Z]{3}-[0-9]{2}$"
      responses:
        "200":
          description: The configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackRuleConfig"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
    put:
      operationId: putPackRuleConfig
      tags: [compliance]
      summary: Set a rule's mode and settings in this environment
      description: |
        Requires `compliance:configure` (people only) and, in the console, a recent second factor.
        `settings` lists values that differ from the library's defaults; each must be within the
        setting's bounds (for regulatory limits, the legal maximum). Omitted settings use the
        default. Applied at once (200), except in production for a regulatory control when any
        setting changes or the mode moves away from live: that is proposed (202) and applies when
        another person with `rules:approve` approves it. Audited.
      parameters:
        - name: rule_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Z]{3}-[0-9]{2}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PackRuleConfigRequest"
      responses:
        "200":
          description: Applied at once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackRuleConfig"
        "202":
          description: Proposed; applies when another person approves it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackRuleChange"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/v1/compliance/rules/{rule_id}/history:
    get:
      operationId: listPackRuleVersions
      tags: [compliance]
      summary: A rule's configuration versions in this environment
      description: Requires `compliance:read`. Newest first; versions never change.
      parameters:
        - name: rule_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Z]{3}-[0-9]{2}$"
      responses:
        "200":
          description: The versions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackRuleVersionList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/v1/compliance/rules/{rule_id}/rollback:
    post:
      operationId: rollbackPackRule
      tags: [compliance]
      summary: Restore an earlier configuration as a new version
      description: |
        Requires `compliance:configure` and, in the console, a recent second factor. The same
        approval rule as a configuration change applies.
      parameters:
        - name: rule_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Z]{3}-[0-9]{2}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version, reason]
              properties:
                version:
                  type: integer
                  minimum: 1
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
      responses:
        "200":
          description: Applied at once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackRuleConfig"
        "202":
          description: Proposed; applies when another person approves it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackRuleChange"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/v1/compliance/rules/{rule_id}/backtest:
    post:
      operationId: backtestPackRule
      tags: [compliance]
      summary: What a rule would have done over recent events
      description: |
        Requires `compliance:read` and `events:read`. Replays this environment's ingested events of
        the last `days` (default 7, at most 30; at most 20,000 events) through the rule with
        `settings` (values that differ from the defaults; omitted: the current configuration) and
        with its current configuration, whatever its mode, with time windows rebuilt in memory.
        Nothing is stored and live state is untouched. Events evaluated before the rule pack ran
        are not replayed.
      parameters:
        - name: rule_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Z]{3}-[0-9]{2}$"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                days:
                  type: integer
                  minimum: 1
                  maximum: 30
                settings:
                  $ref: "#/components/schemas/PackRuleSettings"
      responses:
        "200":
          description: The two configurations' results over the same events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Backtest"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/v1/compliance/fx-rates:
    get:
      operationId: listComplianceFXRates
      tags: [compliance]
      summary: The institution's exchange rates
      description: |
        Requires `compliance:read`. US dollars per one unit of each currency, used to compute
        `txn.amount_usd` for rules on US dollar amounts (REG-10) when the event does not send it.
      responses:
        "200":
          description: The rates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FXRateList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/v1/compliance/fx-rates/{currency}:
    parameters:
      - name: currency
        in: path
        required: true
        schema:
          type: string
          pattern: "^[A-Z]{3}$"
    put:
      operationId: putComplianceFXRate
      tags: [compliance]
      summary: Set a currency's exchange rate
      description: |
        Requires `compliance:write` (people only) and, in the console, a recent second factor.
        Audited. Applies to every environment within 5 seconds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [usd_per_unit]
              properties:
                usd_per_unit:
                  type: number
                  format: double
                  description: US dollars per one unit of the currency (for NGN, about 0.00065).
                  exclusiveMinimum: true
                  minimum: 0
                  maximum: 1000000
      responses:
        "200":
          description: The rate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FXRate"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/DefaultError"
    delete:
      operationId: deleteComplianceFXRate
      tags: [compliance]
      summary: Remove a currency's exchange rate
      description: Requires `compliance:write` (people only). Audited.
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/v1/compliance/restricted-signals:
    get:
      operationId: listRestrictedSignals
      tags: [compliance]
      summary: Compliance-only signals (no tipping off)
      description: |
        Requires `compliance:sensitive`, held only by compliance officers (GOV-09). Rules marked
        compliance-only (such as INS-01, staff-linked accounts) add their points to the score
        under the code `compliance_review` everywhere else: in decisions, events, alerts, webhooks
        and analytics. This lists the evaluations where one fired, with the rule itself, newest
        first, at most 200.
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 30
            default: 7
      responses:
        "200":
          description: The evaluations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestrictedEvaluationList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/v1/compliance/tasks:
    get:
      operationId: listComplianceTasks
      tags: [compliance]
      summary: The compliance work queue
      description: |
        Requires `compliance:read`. What fired regulatory controls require (reports to the NFIU,
        enhanced due diligence, freezing or closing an account), open ones first by deadline, at
        most 500. Suspicious transaction reports are listed only for `compliance:sensitive`
        (GOV-09). For callers who read alerts, `escalations` lists alerts still open past REG-14's
        screening deadline (72 hours by default).
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ComplianceTaskStatus"
      responses:
        "200":
          description: The queue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceQueue"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/v1/compliance/tasks/{task_id}:
    parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          maxLength: 64
    get:
      operationId: getComplianceTask
      tags: [compliance]
      summary: One compliance task
      description: Requires `compliance:read`, and `compliance:sensitive` for a suspicious transaction report.
      responses:
        "200":
          description: The task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceTask"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/v1/compliance/tasks/{task_id}/report:
    parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          maxLength: 64
    patch:
      operationId: editComplianceReport
      tags: [compliance]
      summary: Edit a draft report
      description: |
        Requires `compliance:write`, and `compliance:sensitive` for a suspicious transaction report.
        Only a draft (open) report changes. Omitted fields are unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComplianceReportFields"
      responses:
        "200":
          description: The task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceTask"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/v1/compliance/tasks/{task_id}/approve:
    parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          maxLength: 64
    post:
      operationId: approveComplianceReport
      tags: [compliance]
      summary: Approve a report for filing
      description: |
        Requires `compliance:sensitive`: only compliance officers approve reports (GOV-06), and in
        the console a recent second factor. A suspicious transaction report is approved only when
        goAML would accept it: a predicate offence, at least one indicator and an accepted
        category (REG-19); otherwise 400 says what is missing. Audited.
      responses:
        "200":
          description: The task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceTask"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/v1/compliance/tasks/{task_id}/file:
    parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          maxLength: 64
    post:
      operationId: fileComplianceReport
      tags: [compliance]
      summary: Record that a report was filed
      description: |
        Requires `compliance:sensitive`. Records that a person filed the approved report with the
        regulator, with the reference its portal gave. RiskOS never submits reports. Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [filing_ref]
              properties:
                filing_ref:
                  type: string
                  minLength: 1
                  maxLength: 128
      responses:
        "200":
          description: The task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceTask"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/v1/compliance/tasks/{task_id}/close:
    parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          maxLength: 64
    post:
      operationId: closeComplianceTask
      tags: [compliance]
      summary: Mark a task done or dismiss it
      description: |
        Requires `compliance:write`, and `compliance:sensitive` for a suspicious transaction report.
        Reports are closed by filing them; dismissing any task needs a note. Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status:
                  type: string
                  enum: [done, dismissed]
                note:
                  type: string
                  maxLength: 1000
      responses:
        "200":
          description: The task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceTask"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/v1/compliance/tasks/{task_id}/export:
    parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          maxLength: 64
    get:
      operationId: exportComplianceReport
      tags: [compliance]
      summary: An approved report, for filing by hand
      description: |
        Requires `compliance:write`, and `compliance:sensitive` for a suspicious transaction report.
        Returns the approved report for a person to enter in the regulator's portal. Audited.
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceTask"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/v1/compliance/suspicion:
    post:
      operationId: confirmSuspicion
      tags: [compliance]
      summary: Confirm suspicion on a case
      description: |
        Requires `compliance:sensitive` (compliance officers) and, in the console, a recent second
        factor. Opens a suspicious transaction report for the case, due within REG-14's `str_due`
        (24 hours by default) from now. Nothing about it is visible outside compliance roles
        (GOV-09). Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [case_id]
              properties:
                case_id:
                  type: string
                  maxLength: 64
                note:
                  type: string
                  maxLength: 4000
                  description: The first lines of the report's narrative.
      responses:
        "201":
          description: The report, a draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceTask"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/v1/compliance/changes:
    get:
      operationId: listPackRuleChanges
      tags: [compliance]
      summary: Configuration changes in this environment
      description: Requires `compliance:read`. Newest first, at most 200.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, approved, rejected]
      responses:
        "200":
          description: The changes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackRuleChangeList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/v1/compliance/changes/{change_id}/approve:
    post:
      operationId: approvePackRuleChange
      tags: [compliance]
      summary: Approve a pending change
      description: |
        Requires `rules:approve` (people only) and, in the console, a recent second factor. Nobody
        can approve their own change. Applies the change as the rule's next version, credited to
        its proposer, only if the rule has not changed since (409 otherwise). Audited.
      parameters:
        - name: change_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionNote"
      responses:
        "200":
          description: The approved change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackRuleChange"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/v1/compliance/changes/{change_id}/reject:
    post:
      operationId: rejectPackRuleChange
      tags: [compliance]
      summary: Reject or withdraw a pending change
      description: |
        Requires `rules:approve`, or being the change's proposer (withdrawing it). Audited.
      parameters:
        - name: change_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionNote"
      responses:
        "200":
          description: The rejected change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackRuleChange"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/v1/compliance/clocks:
    get:
      operationId: listComplianceClocks
      tags: [compliance]
      summary: The pack's legal deadlines
      description: |
        Requires `compliance:read`. The reporting and response deadlines the pack's workflows time.
      responses:
        "200":
          description: The pack's legal deadlines.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceClockList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/v1/compliance/gaps:
    get:
      operationId: listComplianceGaps
      tags: [compliance]
      summary: The pack's open questions
      description: |
        Requires `compliance:read`. Open legal questions a person must settle (conflicting or unconfirmed sources).
      responses:
        "200":
          description: The pack's open questions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceGapList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/v1/compliance/glossary:
    get:
      operationId: listComplianceGlossary
      tags: [compliance]
      summary: The pack's glossary
      description: |
        Requires `compliance:read`. Plain-English meanings of the terms the rules use.
      responses:
        "200":
          description: The pack's glossary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceTermList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/v1/compliance/profile:
    get:
      operationId: getComplianceProfile
      tags: [compliance]
      summary: The workspace's compliance profile
      description: |
        Requires `compliance:read`. 404 until a profile is set.
      responses:
        "200":
          description: The workspace's compliance profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceProfile"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
    put:
      operationId: putComplianceProfile
      tags: [compliance]
      summary: Set the workspace's compliance profile
      description: |
        Requires `compliance:write` (people only). Sets the jurisdiction, licence type and capabilities
        that decide which rules apply. Saving adopts the jurisdiction's latest pack version
        (`latest_version` on the pack); rule configuration carries over. Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComplianceProfileRequest"
      responses:
        "200":
          description: The profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceProfile"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/DefaultError"
  /api/v1/sso:
    get:
      operationId: getSSO
      tags: [team]
      summary: The tenant's single sign-on connection
      description: |
        Requires `team:read`. `connection` is null when SSO is not set up. The client secret is never
        returned.
      responses:
        "200":
          description: The redirect URI to register at the provider, and the connection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SSOSettings"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"
    put:
      operationId: putSSO
      tags: [team]
      summary: Set up or change single sign-on
      description: |
        Requires `team:write` and, from the console, re-authentication within the last 10 minutes.
        Audited (without the secret). RiskOS reads the issuer's OpenID Connect discovery document
        first and refuses an issuer it cannot read (400). `client_secret` is required the first time;
        leave it out to keep the stored one. Changing the issuer forgets the provider subjects bound
        to accounts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SSOConnectionInput"
      responses:
        "200":
          description: The connection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SSOConnection"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"
    delete:
      operationId: deleteSSO
      tags: [team]
      summary: Remove single sign-on
      description: |
        Requires `team:write` and, from the console, re-authentication. Audited. People sign in with
        their password again.
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/DefaultError"
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: "API key: `rsk_test_…` or `rsk_live_…`."
  headers:
    XRequestID:
      description: |
        Correlation ID for this request. Echoes a caller-supplied `X-Request-ID` when it is 1-64
        characters of `[A-Za-z0-9._-]`; otherwise a server-generated `req_…` ID.
      schema:
        type: string
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: The `next_cursor` of the previous page.
      schema:
        type: string
        maxLength: 64
    KeyId:
      name: key_id
      in: path
      required: true
      schema:
        type: string
        example: key_01j9x2k7m3q4r5s6t7v8w9x0yz
  responses:
    DefaultError:
      description: Error in the standard RiskOS error contract (spec §7).
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InvalidRequest:
      description: "`INVALID_REQUEST`: the request is malformed or fails validation."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthenticated:
      description: "`UNAUTHENTICATED`: the API key is missing, malformed, unknown, revoked or expired. The response never says which."
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: "`FORBIDDEN`: the key lacks a required scope. `TENANT_SUSPENDED`: the tenant is not active."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: "`NOT_FOUND`: the resource does not exist in the caller's environment. Resources of other tenants or environments are indistinguishable from nonexistent ones."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: "`CONFLICT`: the resource is not in a state that allows the operation. `IDEMPOTENCY_CONFLICT`: the event_id was already used with a different payload."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unprocessable:
      description: "`STALE_EVENT`: occurred_at is outside the accepted window. `INVALID_EVENT`: the event is well-formed but semantically invalid. `SENSITIVE_DATA`: the payload contains data that must never be sent (e.g. a card number)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: "`RATE_LIMITED`: too many requests for this API key or tenant."
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    SignupOptions:
      type: object
      additionalProperties: false
      required: [email, google]
      properties:
        email:
          type: boolean
          description: Sign-up with email, business name and password is available.
        google:
          type: boolean
          description: Signing in and up with Google is available.
    SignupRequest:
      type: object
      additionalProperties: false
      required: [name, email, business_name, password]
      properties:
        name:
          type: string
          maxLength: 100
        email:
          type: string
          maxLength: 254
        business_name:
          type: string
          maxLength: 200
        password:
          type: string
          maxLength: 128
    SignupPending:
      type: object
      additionalProperties: false
      required: [email, resend_after_seconds, expires_at]
      properties:
        email:
          type: string
          description: Where the code was sent.
        resend_after_seconds:
          type: integer
          description: How long until another code can be requested.
        expires_at:
          type: string
          format: date-time
          description: When the sign-up lapses (start again after).
    SignupVerifyRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          pattern: "^[0-9]{6}$"
    SignupCompleteRequest:
      type: object
      additionalProperties: false
      required: [business_name]
      properties:
        business_name:
          type: string
          maxLength: 200
    GoogleResult:
      type: object
      additionalProperties: false
      required: [outcome]
      properties:
        outcome:
          type: string
          enum: [signed_in, needs_business]
        auth:
          $ref: "#/components/schemas/AuthState"
        email:
          type: string
          description: The Google account's email (needs_business).
        name:
          type: string
          description: The Google account's name (needs_business).
    OnboardingStatus:
      type: string
      enum: [draft, submitted, approved, rejected]
    OnboardingAnswers:
      type: object
      additionalProperties: false
      description: |
        Know-your-business answers. Every field is optional while drafting; `submitOnboarding`
        requires the ones listed in `Onboarding.missing`.
      properties:
        legal_name:
          type: string
          maxLength: 200
        trading_name:
          type: string
          maxLength: 200
        country:
          type: string
          description: Country of incorporation, ISO 3166-1 alpha-2.
          pattern: "^[A-Z]{2}$"
        registration_number:
          type: string
          maxLength: 100
        website:
          type: string
          maxLength: 300
        industry:
          type: string
          enum: [payments, lending, banking, crypto, marketplace, insurance, gaming, other]
        regulated:
          type: boolean
          description: Licensed or registered with a financial regulator.
        regulator:
          type: string
          maxLength: 200
        licence_number:
          type: string
          maxLength: 100
        aml_program:
          type: boolean
          description: Has a documented AML/CFT programme.
        compliance_officer_name:
          type: string
          maxLength: 100
        compliance_officer_email:
          type: string
          maxLength: 254
        screening_provider:
          type: string
          maxLength: 200
          description: Sanctions and PEP screening provider, if any.
        monitored_events:
          type: array
          maxItems: 6
          uniqueItems: true
          items:
            type: string
            enum: [payments, payouts, transfers, logins, signups, card_transactions]
        monthly_volume:
          type: string
          enum: [under_10k, 10k_100k, 100k_1m, 1m_10m, over_10m]
        regions_served:
          type: array
          maxItems: 60
          uniqueItems: true
          items:
            type: string
            pattern: "^[A-Z]{2}$"
        go_live:
          type: string
          enum: [now, within_3_months, within_6_months, later]
        data_protection:
          type: array
          maxItems: 8
          uniqueItems: true
          items:
            type: string
            enum: [gdpr, uk_gdpr, ndpr, popia, ccpa, lgpd, other]
        data_residency:
          type: string
          enum: [eu, uk, us, africa, no_preference]
        dpo_email:
          type: string
          maxLength: 254
        accept_terms:
          type: boolean
        accept_dpa:
          type: boolean
    Backtest:
      type: object
      additionalProperties: false
      required: [rule, from, to, replayed, truncated, candidate, current]
      properties:
        rule:
          type: string
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        replayed:
          type: integer
          description: Events replayed.
        truncated:
          type: boolean
          description: The event limit cut the period short; the replay covers its oldest events.
        candidate:
          $ref: "#/components/schemas/BacktestTally"
        current:
          $ref: "#/components/schemas/BacktestTally"
    BacktestTally:
      type: object
      additionalProperties: false
      required: [triggered, fired, clear, not_evaluated, missing, fired_samples]
      properties:
        triggered:
          type: integer
        fired:
          type: integer
        clear:
          type: integer
        not_evaluated:
          type: integer
        missing:
          type: array
          description: What made the rule not evaluated, most frequent first.
          items:
            $ref: "#/components/schemas/BacktestMissing"
        fired_samples:
          type: array
          description: Events the rule fired on (at most 20, oldest first).
          items:
            type: string
    BacktestMissing:
      type: object
      additionalProperties: false
      required: [item, events]
      properties:
        item:
          type: string
        events:
          type: integer
    FXRate:
      type: object
      additionalProperties: false
      required: [currency, usd_per_unit, updated_at, updated_by]
      properties:
        currency:
          type: string
        usd_per_unit:
          type: number
          format: double
        updated_at:
          type: string
          format: date-time
        updated_by:
          type: string
    FXRateList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/FXRate"
    RestrictedSignal:
      type: object
      additionalProperties: false
      required: [rule, name, weight, mode]
      properties:
        rule:
          type: string
        name:
          type: string
        weight:
          type: integer
        mode:
          $ref: "#/components/schemas/PackRuleMode"
    RestrictedEvaluation:
      type: object
      additionalProperties: false
      required: [evaluation_id, event_id, created_at, signals]
      properties:
        evaluation_id:
          type: string
        event_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        signals:
          type: array
          items:
            $ref: "#/components/schemas/RestrictedSignal"
    RestrictedEvaluationList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/RestrictedEvaluation"
    ComplianceTaskStatus:
      type: string
      description: Reports go open (a draft), approved, filed; other tasks open, done. Any may be dismissed.
      enum: [open, approved, filed, done, dismissed]
    ComplianceReportFields:

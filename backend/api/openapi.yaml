    EventType:
      type: string
      enum: [login, transaction, beneficiary_added, device_change, session_change, profile_change, activity]
    EventKey:
      type: string
      description: The customer's unique ID for the event; the idempotency key.
      pattern: "^[A-Za-z0-9._:-]{1,128}$"
      example: txn_2026_000123
    Reference:
      type: string
      description: An opaque customer-side identifier.
      pattern: "^[A-Za-z0-9._:-]{1,128}$"
    Actor:
      type: object

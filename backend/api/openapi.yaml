      required: [id, name, description, group, kind, status, regulators, applies_to, requires, sources, effective, verification, defaults, inputs, events, outcome, parameters, applicable, mode, config_version]
      properties:
        id:
          type: string
        name:
          type: string
          description: The library's plain-English name, verbatim.
        description:
          type: string
          description: The library's plain-English description, verbatim.
        action:
          type: string
          description: What the system does (controls only), verbatim.
        points:
          type: string
          description: The library's points column (signals only), verbatim.
        group:
          type: string
        kind:
          $ref: "#/components/schemas/ComplianceRuleKind"
        status:
          type: string
          enum: [regulatory, recommended, governance]
        regulators:
          type: array
          items:
            type: string
        applies_to:
          type: array
          description: Licence types the rule applies to. Empty means every institution.
          items:
            type: string
        requires:
          type: array
          description: Capabilities the workspace must have for the rule to apply.
          items:
            type: string
        sources:
          type: array
          description: Source IDs (see the pack's sources).
          items:
            type: string
        effective:
          $ref: "#/components/schemas/ComplianceEffective"
        verification:
          $ref: "#/components/schemas/ComplianceVerification"
        caveat:
          type: string
        defaults:
          $ref: "#/components/schemas/ComplianceDefaults"
        inputs:
          type: array
          description: The data the rule needs. When one is unavailable the rule is reported as not evaluated.
          items:
            type: string
        events:
          type: array
          description: The event types the rule is evaluated on.
          items:
            type: string
        outcome:
          $ref: "#/components/schemas/ComplianceOutcome"
        parameters:
          type: array
          items:
            $ref: "#/components/schemas/ComplianceParameter"
        applicable:
          type: boolean
          nullable: true
          description: Whether the rule applies to the workspace's profile; null without a profile.
        mode:
          $ref: "#/components/schemas/PackRuleMode"
        config_version:
          type: integer
          description: The rule's configuration version in this environment; 0 means the library's defaults.
        engineering_logic:
          type: string
          description: The library's section 7B logic. Only for `compliance:engineering`.
        definition:
          type: object
          additionalProperties: true
          description: The machine definition the engine interprets. Only for `compliance:engineering`.

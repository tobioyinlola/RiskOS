# Failure and restore drills against the full stack (docs/DISASTER_RECOVERY.md). They take about
# 15 minutes, so they run weekly and on demand rather than on every push.
name: drills

on:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drills:
    name: drills / failure and restore
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cp .env.example .env
      - run: make up
      - run: make failure-drill
      - run: make restore-drill
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drill-results
          path: backend/test/load/results
          retention-days: 90
      - if: failure()
        run: docker compose --profile app logs --tail=300 api worker

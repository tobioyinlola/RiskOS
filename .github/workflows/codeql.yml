# Static analysis with CodeQL for the Go backend and the TypeScript console (docs/SECURITY.md).
# The repository is private without GitHub Advanced Security, so results are not uploaded to code
# scanning: each job writes SARIF, keeps it as an artifact, prints every finding and fails on any
# with a security severity of 7.0 (high) or more.
name: codeql

on:
  # Not a pull request check (the pull request has two: ci.yml). Weekly, and by hand from the
  # Actions tab before a release.
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 2" # Tuesdays 04:41 UTC, for newly published queries

permissions:
  contents: read

jobs:
  analyze:
    name: codeql / ${{ matrix.language }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read # the analyze step reads its own workflow run
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: go, build-mode: manual }
          - { language: javascript-typescript, build-mode: none }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
          config: |
            paths-ignore:
              - frontend/node_modules
              - frontend/lib/api/schema.gen.ts
              - backend/internal/apigen
              - backend/**/sqlcgen
      - if: matrix.language == 'go'
        working-directory: backend
        run: go build ./...
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
          upload: never
          output: sarif
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-${{ matrix.language }}
          path: sarif
          retention-days: 30
      - name: fail on high-severity findings
        run: python3 scripts/sarif-gate.py sarif/*.sarif

# Local OpenTelemetry Collector: receives OTLP from the api and worker and prints a summary.
# Production pipelines (a tracing backend, metrics store and alerting) are chosen in the
# observability design (docs/OBSERVABILITY.md, TODO(phase-8)).
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  debug:
    verbosity: basic

service:
  telemetry:
    logs:
      level: warn
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]

# Git hooks. Install once with `make hooks`. Pushes to staging start no CI workflow, so the
# pre-push hook is the gate for staging: `make verify` must pass before anything is pushed.
# CI and CodeQL run on pull requests to main.
pre-commit:
  parallel: true
  commands:
    secrets:
      run: gitleaks git --pre-commit --staged --redact --no-banner .
    large-files:
      run: ./scripts/check-large-files.sh {staged_files}
    go-format:
      glob: "backend/**/*.go"
      root: backend/
      run: golangci-lint fmt --diff {staged_files}
    go-lint:
      glob: "backend/**/*.go"
      root: backend/
      run: golangci-lint run --new-from-rev=HEAD ./...
    frontend-lint:
      glob: "frontend/**/*.{ts,tsx,js,mjs}"
      root: frontend/
      run: pnpm exec eslint --max-warnings=0 --no-warn-ignored {staged_files}
    frontend-format:
      glob: "frontend/**/*.{ts,tsx,js,mjs,json,css,md}"
      root: frontend/
      run: pnpm exec prettier --check --ignore-unknown {staged_files}

pre-push:
  commands:
    no-direct-push-to-main:
      use_stdin: true
      run: ./scripts/check-push-target.sh
    verify:
      run: make verify

commit-msg:
  commands:
    conventional-commit:
      run: ./scripts/check-commit-msg.sh {1}
